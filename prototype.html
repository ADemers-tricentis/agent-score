<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentScore</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#252840;--border:#2e3250;
  --text:#e2e8f0;--muted:#8892b0;--dim:#4a5568;
  --pass:#22c55e;--pass-bg:#052e16;--pass-border:#064e1e;
  --partial:#f59e0b;--partial-bg:#271a03;--partial-border:#451a03;
  --fail:#ef4444;--fail-bg:#2d0808;--fail-border:#450a0a;
  --accent:#6366f1;--accent-bg:#1e1f3a;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:14px}
/* ── Sidebar ── */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo{padding:18px 16px 14px;font-size:17px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);letter-spacing:-.3px;display:flex;align-items:baseline;gap:7px}
.logo-sub{font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.nav-section{padding:8px 0}
.nav-label{padding:8px 16px 4px;font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .12s;border-left:2px solid transparent;user-select:none}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--text);background:var(--accent-bg);border-left-color:var(--accent)}
.nav-icon{width:16px;text-align:center;font-size:12px;flex-shrink:0}
/* ── Main ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:100vh}
.topbar{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-shrink:0;position:sticky;top:0;z-index:10}
.crumb{cursor:pointer;transition:color .12s}.crumb:hover{color:var(--accent)}
.sep{color:var(--dim)}.current{color:var(--text);font-weight:500}
.content{padding:24px;flex:1}
/* ── Page header ── */
.ph{margin-bottom:22px}
.ph-title{font-size:21px;font-weight:700;margin-bottom:3px}
.ph-sub{font-size:13px;color:var(--muted)}
/* ── Stats row ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}
/* ── Project grid ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.ptile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all .14s}
.ptile:hover{border-color:var(--accent);background:var(--surface2);transform:translateY(-1px)}
.ptile-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ptile-name{font-size:14px;font-weight:600}
.type-tag{font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.04em;flex-shrink:0;margin-left:8px}
.type-tag.ATA,.type-tag.ATC{background:#1e3a5f;color:#60a5fa}
.type-tag.CODING{background:#1a2e1e;color:#4ade80}
.type-tag.CURA{background:#2e1a2e;color:#c084fc}
.type-tag.APT{background:#2e2a1a;color:#fbbf24}
.type-tag.AI_WORKSPACE{background:#1a2e2e;color:#22d3ee}
.tile-counts{display:flex;gap:18px;margin-bottom:12px}
.tc-item{text-align:center}
.tc-val{font-size:19px;font-weight:700}
.tc-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pass-bar-wrap{margin:10px 0 4px}
.pbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px}
.pass-bar{height:5px;background:var(--surface2);border-radius:3px;display:flex;overflow:hidden}
.pb-pass{background:var(--pass)}.pb-partial{background:var(--partial)}.pb-fail{background:var(--fail)}
.tile-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
/* ── Verdict badge ── */
.vbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.05em;display:inline-block}
.vbadge.PASS{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-border)}
.vbadge.PARTIAL{background:var(--partial-bg);color:var(--partial);border:1px solid var(--partial-border)}
.vbadge.FAIL{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-border)}
/* ── Reliability badge ── */
.rbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.04em}
.rbadge.RELIABLE{background:var(--pass-bg);color:var(--pass)}
.rbadge.NEEDS_WORK{background:var(--partial-bg);color:var(--partial)}
.rbadge.UNSTABLE{background:var(--fail-bg);color:var(--fail)}
/* ── Table ── */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:11px 14px;vertical-align:middle}
.vdist{display:flex;gap:5px}
.vd{font-size:10px;padding:2px 6px;border-radius:3px}
.vd.pass{background:var(--pass-bg);color:var(--pass)}
.vd.partial{background:var(--partial-bg);color:var(--partial)}
.vd.fail{background:var(--fail-bg);color:var(--fail)}
/* ── Session header ── */
.sess-hdr{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:18px;display:flex;align-items:center;gap:20px}
.verdict-xl{font-size:20px;font-weight:800;padding:10px 18px;border-radius:8px;letter-spacing:.08em;flex-shrink:0}
.verdict-xl.PASS{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-border)}
.verdict-xl.PARTIAL{background:var(--partial-bg);color:var(--partial);border:1px solid var(--partial-border)}
.verdict-xl.FAIL{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-border)}
.sess-meta{flex:1}
.sess-id{font-size:12px;color:var(--muted);font-family:monospace;margin-bottom:4px}
.sess-scenario{font-size:14px;font-weight:600;margin-bottom:3px}
.sess-ts{font-size:12px;color:var(--muted)}
/* ── Metric cards ── */
.metric-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.mc.mc-fail{border-color:var(--fail-border)}.mc.mc-pass{border-color:var(--pass-border)}.mc.mc-partial{border-color:var(--partial-border)}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mc-name{font-size:13px;font-weight:600}
.mc-score{font-size:22px;font-weight:800;margin-bottom:6px}
.score-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin:6px 0 12px}
.score-fill{height:100%;border-radius:2px}
.signals{font-size:11px}
.sig-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)}
.sig-row:last-child{border-bottom:none}
.sig-name{color:var(--muted)}
.sig-score{font-weight:600}
.sig-score.ok{color:var(--pass)}.sig-score.bad{color:var(--fail)}.sig-score.warn{color:var(--partial)}
.fbadge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:5px}
.fbadge.critical{background:#450a0a;color:#fca5a5}.fbadge.high{background:#451a03;color:#fed7aa}.fbadge.medium{background:#271a03;color:var(--partial)}
/* ── Attribution panel ── */
.attr-panel{background:var(--surface);border:1px solid var(--fail-border);border-radius:10px;padding:18px;margin-bottom:18px}
.attr-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.attr-icon{font-size:16px}
.attr-title{font-size:14px;font-weight:700}
.attr-sub{font-size:11px;color:var(--muted)}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.af{background:var(--surface2);border-radius:7px;padding:10px 12px}
.af-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.af-val{font-size:13px;font-weight:600;font-family:monospace}
.conf-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:5px}
.conf-fill{height:100%;background:var(--fail);border-radius:3px}
.chain-wrap,.recs-wrap{background:var(--surface2);border-radius:7px;padding:12px;margin-bottom:12px}
.chain-wrap:last-child,.recs-wrap:last-child{margin-bottom:0}
.block-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chain-step{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.chain-step:last-child{border-bottom:none}
.chain-num{color:var(--dim);font-weight:700;width:16px;flex-shrink:0}
.chain-tool{font-family:monospace;color:var(--accent);margin-right:5px}
.chain-desc{color:var(--muted)}
.chain-step.culprit .chain-desc{color:var(--fail)}
.culprit-tag{color:var(--fail);font-size:9px;font-weight:700;margin-left:4px}
.rec-item{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.rec-item:last-child{border-bottom:none}
.rec-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
/* ── Report section ── */
.report-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:18px}
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface2)}
.tab{padding:9px 18px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .12s;user-select:none}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.tab-content{padding:18px;display:none}
.tab-content.active{display:block}
.md-body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.7;font-size:13px}
.md-body h1{font-size:16px;margin:0 0 10px;color:var(--text)}
.md-body h2{font-size:13px;margin:14px 0 6px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:3px;font-weight:600}
.md-body h3{font-size:12px;margin:10px 0 4px;color:var(--muted);font-weight:600}
.md-body p{margin:4px 0;color:var(--muted)}
.md-body code{font-family:monospace;background:var(--surface2);padding:1px 4px;border-radius:3px;font-size:11px}
.md-body .c-pass{color:var(--pass);font-weight:600}.md-body .c-fail{color:var(--fail);font-weight:600}.md-body .c-partial{color:var(--partial);font-weight:600}
.json-body{font-family:'Fira Code',monospace;font-size:11px;white-space:pre;overflow-x:auto;line-height:1.65;color:var(--muted)}
.jk{color:#7dd3fc}.js{color:#86efac}.jn{color:#fcd34d}.jb{color:#f9a8d4}
/* ── Guard log ── */
.guard-stream{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.stream-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
.stream-title{font-size:13px;font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--pass);font-weight:600}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--pass);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ge{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border);font-size:11px;font-family:monospace}
.ge:last-child{border-bottom:none}
.ge-ts{color:var(--dim);width:80px;flex-shrink:0}
.ge-proj{color:var(--accent);width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ge-tool{color:#7dd3fc;flex:1}
.ge-reason{color:var(--muted);flex:2;font-size:10px}
.dbadge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em;width:46px;text-align:center;flex-shrink:0}
.dbadge.allow{background:var(--pass-bg);color:var(--pass)}
.dbadge.warn{background:var(--partial-bg);color:var(--partial)}
.dbadge.block{background:var(--fail-bg);color:var(--fail)}
/* ── Metrics ── */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.chart-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.barchart{display:flex;flex-direction:column;gap:7px}
.br{display:flex;align-items:center;gap:8px;font-size:12px}
.br-label{width:115px;color:var(--muted);flex-shrink:0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-track{flex:1;height:16px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.br-seg{height:100%}
.br-seg.pass{background:var(--pass)}.br-seg.partial{background:var(--partial)}.br-seg.fail{background:var(--fail)}.br-seg.accent{background:var(--accent)}
.br-val{width:36px;text-align:right;color:var(--muted);font-size:10px}
/* ── Buttons ── */
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .12s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#4f46e5}.btn-primary:disabled{opacity:.5;cursor:default}
.btn-secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}.btn-secondary:hover{color:var(--text)}
/* ── Misc ── */
.section-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.mono{font-family:monospace}.c-muted{color:var(--muted)}.c-pass{color:var(--pass)}.c-fail{color:var(--fail)}.c-partial{color:var(--partial)}.c-accent{color:var(--accent)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein .18s ease}
</style>
</head>

//  STATE
// ═══════════════════════════════════════════════════════
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem('as_state')||'{}');
    return {view:'fleet',proj:null,run:null,sess:null,...s,projects:SEED.projects};
  }catch(e){return {view:'fleet',proj:null,run:null,sess:null,projects:SEED.projects};}
}
function saveState(){try{localStorage.setItem('as_state',JSON.stringify({view:S.view,proj:S.proj,run:S.run,sess:S.sess}));}catch(e){}}

let S=loadState();

// ═══════════════════════════════════════════════════════
//  LOOKUP HELPERS
// ═══════════════════════════════════════════════════════
const getProj=id=>S.projects.find(p=>p.id===id);
const getRun=(p,rid)=>p?.runs.find(r=>r.id===rid);
const getSess=(r,sid)=>r?.sessions.find(s=>s.id===sid);
const allSess=p=>p.runs.flatMap(r=>r.sessions);
const passRate=ss=>ss.length?ss.filter(s=>s.verdict==='PASS').length/ss.length:0;
const pct=v=>Math.round(v*100)+'%';
const fmtDur=ms=>{const s=Math.round(ms/1000);return s>=60?`${Math.floor(s/60)}m ${s%60}s`:`${s}s`;};
const fmtDate=d=>new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function scoreColor(score,passed){if(passed)return'var(--pass)';if(score>=.6)return'var(--partial)';return'var(--fail)';}
function scoreCls(score,passed){if(passed)return'ok';if(score>=.6)return'warn';return'bad';}

// ═══════════════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════════════
function go(view,proj,run,sess){
  S.view=view;
  if(proj!==undefined)S.proj=proj;
  if(run!==undefined)S.run=run;
  if(sess!==undefined)S.sess=sess;
  saveState();render();
}

// ═══════════════════════════════════════════════════════
//  RENDER DISPATCH
// ═══════════════════════════════════════════════════════
function render(){
  // nav active state
  document.querySelectorAll('[data-view]').forEach(el=>
    el.classList.toggle('active',el.dataset.view===S.view));
  // project nav
  document.getElementById('proj-nav').innerHTML=S.projects.map(p=>`
    <div class="nav-item${S.proj===p.id&&['project','run','session'].includes(S.view)?' active':''}"
         onclick="go('project','${p.id}')">
      <span class="nav-icon" style="font-size:9px">
        <span class="type-tag ${p.type}" style="font-size:7px;padding:1px 3px">${p.type.replace('_',' ')}</span>
      </span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name.split('—')[0].trim()}</span>
    </div>`).join('');
  const main=document.getElementById('main');
  const views={fleet:renderFleet,project:renderProject,run:renderRun,session:renderSession,guard:renderGuard,metrics:renderMetrics};
  main.innerHTML=(views[S.view]||renderFleet)();
  // tab wiring
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    const g=t.dataset.group;
    document.querySelectorAll(`.tab[data-group="${g}"]`).forEach(x=>x.classList.remove('active'));
    document.querySelectorAll(`.tab-content[data-group="${g}"]`).forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelector(`.tab-content[data-group="${g}"][data-tab="${t.dataset.tab}"]`)?.classList.add('active');
  }));
}

  const rate=all.length?passes/all.length:0;
  return`

<div class="content fadein">

  const partC=ss.filter(s=>s.verdict==='PARTIAL').length;
  const failC=ss.filter(s=>s.verdict==='FAIL').length;
  const latest=ss[0];
  return`
<div class="ptile" onclick="go('project','${p.id}')">
  <div class="ptile-top">
    <div class="ptile-name">${p.name}</div>
    <span class="type-tag ${p.type}">${p.type.replace('_',' ')}</span>
  </div>

    <div class="tc-item"><div class="tc-val">${p.runs.length}</div><div class="tc-label">Runs</div></div>
    <div class="tc-item"><div class="tc-val">${ss.length}</div><div class="tc-label">Sessions</div></div>
    <div class="tc-item"><div class="tc-val" style="color:${rate>=.7?'var(--pass)':rate>=.5?'var(--partial)':'var(--fail)'}">${pct(rate)}</div><div class="tc-label">Pass Rate</div></div>
  </div>
  <div class="pass-bar-wrap">
    <div class="pbl">
      <span class="c-pass">■ ${passC} PASS</span>
      <span class="c-partial">■ ${partC} PARTIAL</span>
      <span class="c-fail">■ ${failC} FAIL</span>
    </div>
    <div class="pass-bar">
      <div class="pb-pass" style="width:${pct(passC/ss.length||0)}"></div>
      <div class="pb-partial" style="width:${pct(partC/ss.length||0)}"></div>
      <div class="pb-fail" style="width:${pct(failC/ss.length||0)}"></div>
    </div>
  </div>
  <div class="tile-footer">
    <span class="vbadge ${latest?.verdict||'PASS'}">Latest: ${latest?.verdict||'—'}</span>
    <span class="rbadge ${p.reliability}">${p.reliability.replace('_',' ')}</span>
  </div>
</div>`;
}

  const cls=m.passed?m.score>=.85?'mc-pass':'mc-partial':'mc-fail';
  const col=scoreColor(m.score,m.passed);
  return`
<div class="mc ${cls}">
  <div class="mc-top">
    <div class="mc-name">${name}</div>
    <span class="vbadge ${m.passed?'PASS':'FAIL'}">${m.passed?'PASS':'FAIL'}</span>
  </div>
  <div class="mc-score" style="color:${col}">${pct(m.score)}</div>
  <div class="score-bar"><div class="score-fill" style="width:${pct(m.score)};background:${col}"></div></div>
  <div class="signals">
    ${m.sigs.map(sg=>`
      <div class="sig-row">
        <span class="sig-name">${sg.name}</span>

</div>`;
}

    <div class="af"><div class="af-label">Confidence</div>
      <div class="af-val">${pct(a.confidence)}</div>
      <div class="conf-bar"><div class="conf-fill" style="width:${pct(a.confidence)}"></div></div></div>
    <div class="af"><div class="af-label">Agent Fault</div>
      <div class="af-val" style="color:${a.agentFault?'var(--fail)':'var(--pass)'}">${a.agentFault?'YES':'NO'}</div></div>
    <div class="af"><div class="af-label">Steps Implicated</div>
      <div class="af-val">${a.chain.filter(c=>c.culprit).length} of ${a.chain.length}</div></div>
  </div>
  <div class="chain-wrap">
    <div class="block-label">Evidence Chain</div>
    ${a.chain.map(c=>`
      <div class="chain-step${c.culprit?' culprit':''}">
        <span class="chain-num">${c.n}.</span>
        <div><span class="chain-tool">${c.tool}</span>
          <span class="chain-desc">${c.desc}</span>
          ${c.culprit?'<span class="culprit-tag">◀ CULPRIT</span>':''}
        </div>
      </div>`).join('')}
  </div>
  <div class="recs-wrap">
    <div class="block-label">Recommendations</div>
    ${a.recs.map(r=>`
      <div class="rec-item"><div class="rec-dot"></div><div>${r}</div></div>`).join('')}
  </div>
</div>`;
}

function reportSection(s){
  return`
<div class="report-wrap">
  <div class="tab-bar">
    <div class="tab active" data-group="rpt" data-tab="md">Markdown Report</div>
    <div class="tab" data-group="rpt" data-tab="json">JSON Report</div>
    <div class="tab" data-group="rpt" data-tab="guard">Guard Log</div>
  </div>
  <div class="tab-content active" data-group="rpt" data-tab="md">
    <div class="md-body">${mdReport(s)}</div>
  </div>
  <div class="tab-content" data-group="rpt" data-tab="json">
    <div class="json-body">${jsonReport(s)}</div>
  </div>
  <div class="tab-content" data-group="rpt" data-tab="guard">
    ${guardForSession(s.id)}
  </div>
</div>`;
}

function mdReport(s){
  const vc=s.verdict==='PASS'?'c-pass':s.verdict==='FAIL'?'c-fail':'c-partial';
  let h=`<h1>AgentScore Session Report</h1>
<p><strong>Session:</strong> <code>${s.id}</code></p>
<p><strong>Scenario:</strong> ${s.scenario}</p>
<p><strong>Timestamp:</strong> ${s.ts} &nbsp;·&nbsp; Duration: ${fmtDur(s.dur)}</p>
<p><strong>Overall Verdict:</strong> <span class="${vc}">${s.verdict}</span></p>`;
  ['security','correctness','quality'].forEach(dim=>{
    const m=s.scores[dim];
    const mc=m.passed?'c-pass':m.score>=.6?'c-partial':'c-fail';
    h+=`<h2>${dim.charAt(0).toUpperCase()+dim.slice(1)} — <span class="${mc}">${pct(m.score)}</span></h2>`;
    m.sigs.forEach(sg=>{
      const sc=sg.passed?'c-pass':sg.score>=.6?'c-partial':'c-fail';
      h+=`<p><code>${sg.name}</code> — <span class="${sc}">${pct(sg.score)}</span>${sg.finding?` &nbsp;<strong style="color:var(--fail)">${sg.finding.toUpperCase()}</strong>`:''}</p>`;
    });
  });
  if(s.attr){
    const a=s.attr;
    h+=`<h2>Attribution</h2>
<p><strong>Root Cause:</strong> <span class="c-fail">${a.rootCause}</span></p>
<p><strong>Confidence:</strong> ${pct(a.confidence)}</p>
<p><strong>Agent Fault:</strong> ${a.agentFault?'Yes':'No'}</p>
<h3>Recommendations</h3>`;
    a.recs.forEach((r,i)=>h+=`<p>${i+1}. ${r}</p>`);
  }
  return h;
}

function jsonReport(s){
  const obj={
    sessionId:s.id,scenario:s.scenario,timestamp:s.ts,durationMs:s.dur,verdict:s.verdict,
    scores:{
      security:{score:s.scores.security.score,passed:s.scores.security.passed,signals:s.scores.security.sigs},
      correctness:{score:s.scores.correctness.score,passed:s.scores.correctness.passed,signals:s.scores.correctness.sigs},
      quality:{score:s.scores.quality.score,passed:s.scores.quality.passed,signals:s.scores.quality.sigs}
    },
    attribution:s.attr?{rootCause:s.attr.rootCause,confidence:s.attr.confidence,agentFault:s.attr.agentFault,
      chain:s.attr.chain,recommendations:s.attr.recs}:null
  };
  return hlJson(JSON.stringify(obj,null,2));
}

function hlJson(json){
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{
      if(/^"/.test(m))return`<span class="${/:$/.test(m)?'jk':'js'}">${m}</span>`;
      if(/true|false/.test(m))return`<span class="jb">${m}</span>`;
      return`<span class="jn">${m}</span>`;
    });
}

function guardForSession(sid){
  const es=GUARD_LOG.filter(e=>e.sess===sid);
  if(!es.length)return'<div class="c-muted" style="font-size:13px">No guard decisions recorded for this session.</div>';
  return es.map(e=>`
    <div class="ge" style="padding:7px 0;border-bottom:1px solid var(--border)">
      <span class="ge-ts">${e.ts}</span>
      <span class="dbadge ${e.dec}">${e.dec.toUpperCase()}</span>
      <span class="ge-tool">${e.tool}</span>
      <span class="ge-reason">${e.reason}</span>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════
//  GUARD LOG
// ═══════════════════════════════════════════════════════
function renderGuard(){
  const allow=GUARD_LOG.filter(e=>e.dec==='allow').length;
  const warn=GUARD_LOG.filter(e=>e.dec==='warn').length;
  const block=GUARD_LOG.filter(e=>e.dec==='block').length;
  return`
<div class="topbar"><span class="current">Guard Log</span></div>
<div class="content fadein">
  <div class="ph"><div class="ph-title">Runtime Guard Log</div>
    <div class="ph-sub">Synchronous pre-tool-use decisions · v3 loop-detector (R1/R2/R3) · Target &lt;50ms P95</div></div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Total Decisions</div><div class="stat-val">${GUARD_LOG.length}</div></div>
    <div class="stat"><div class="stat-label">Allow</div><div class="stat-val c-pass">${allow}</div></div>
    <div class="stat"><div class="stat-label">Warn</div><div class="stat-val c-partial">${warn}</div></div>
    <div class="stat"><div class="stat-label">Block</div><div class="stat-val c-fail">${block}</div></div>
  </div>
  <div class="guard-stream">
    <div class="stream-hdr">
      <span class="stream-title">Decision Stream</span>
      <span class="live-pill"><span class="live-dot"></span>LIVE</span>
    </div>
    ${GUARD_LOG.map(e=>`
      <div class="ge">
        <span class="ge-ts">${e.ts}</span>
        <span class="ge-proj c-accent">${e.proj}</span>
        <span class="dbadge ${e.dec}">${e.dec.toUpperCase()}</span>
        <span class="ge-tool">${e.tool}</span>
        <span class="ge-reason">${e.reason}</span>
      </div>`).join('')}
  </div>
</div>`;
}

// ═══════════════════════════════════════════════════════
//  METRICS
// ═══════════════════════════════════════════════════════
function renderMetrics(){
  const all=S.projects.flatMap(p=>allSess(p));
  const passC=all.filter(s=>s.verdict==='PASS').length;
  const partC=all.filter(s=>s.verdict==='PARTIAL').length;
  const failC=all.filter(s=>s.verdict==='FAIL').length;
  const blockC=GUARD_LOG.filter(e=>e.dec==='block').length;

  // root cause distribution
  const causes={};
  all.filter(s=>s.attr).forEach(s=>{causes[s.attr.rootCause]=(causes[s.attr.rootCause]||0)+1;});
  const totalCauses=Object.values(causes).reduce((a,b)=>a+b,0)||1;

  // duration buckets
  const buckets=[{l:'0–20s',min:0,max:20000},{l:'20–40s',min:20000,max:40000},{l:'40–60s',min:40000,max:60000},{l:'60s+',min:60000,max:Infinity}];
  const maxBucket=Math.max(...buckets.map(b=>all.filter(s=>s.dur>=b.min&&s.dur<b.max).length))||1;

  return`
<div class="topbar"><span class="current">Metrics</span></div>
<div class="content fadein">
  <div class="ph"><div class="ph-title">Metrics Dashboard</div>
    <div class="ph-sub">OTLP metric catalog · <code>AgentScore.eval.*</code> · Pre-built SigNoz dashboard at <code>scripts/signoz-dashboard.json</code></div></div>
  <div class="stats">
    <div class="stat"><div class="stat-label">eval.outcome PASS</div><div class="stat-val c-pass">${passC}</div><div class="stat-sub">counter · all projects</div></div>
    <div class="stat"><div class="stat-label">eval.outcome PARTIAL</div><div class="stat-val c-partial">${partC}</div><div class="stat-sub">counter · all projects</div></div>
    <div class="stat"><div class="stat-label">eval.outcome FAIL</div><div class="stat-val c-fail">${failC}</div><div class="stat-sub">counter · all projects</div></div>
    <div class="stat"><div class="stat-label">guard.decisions BLOCK</div><div class="stat-val c-fail">${blockC}</div><div class="stat-sub">counter · loop detector</div></div>
  </div>
  <div class="metrics-grid">
    <div class="chart-card">
      <div class="chart-title">AgentScore.eval.outcome by project</div>
      <div class="barchart">
      ${S.projects.map(p=>{
        const ss=allSess(p);const total=ss.length||1;
        const pp=ss.filter(s=>s.verdict==='PASS').length/total;
        const xp=ss.filter(s=>s.verdict==='PARTIAL').length/total;
        const fp=ss.filter(s=>s.verdict==='FAIL').length/total;
        return`<div class="br">
          <span class="br-label" title="${p.name}">${p.name.split('—')[0].trim()}</span>
          <div class="br-track">
            <div class="br-seg pass" style="width:${pct(pp)}"></div>
            <div class="br-seg partial" style="width:${pct(xp)}"></div>
            <div class="br-seg fail" style="width:${pct(fp)}"></div>
          </div>
          <span class="br-val">${pct(pp)}</span>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AgentScore.eval.metric_score averages</div>
      <div class="barchart">
      ${['security','correctness','quality'].map(dim=>{
        const avg=all.reduce((a,s)=>a+s.scores[dim].score,0)/all.length;
        const cls=avg>=.75?'pass':avg>=.6?'partial':'fail';
        return`<div class="br">
          <span class="br-label" style="text-transform:capitalize">${dim}</span>
          <div class="br-track"><div class="br-seg ${cls}" style="width:${pct(avg)}"></div></div>
          <span class="br-val" style="color:var(--${cls})">${pct(avg)}</span>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AgentScore.eval.root_cause distribution</div>
      <div class="barchart">
      ${Object.entries(causes).map(([cause,count])=>`
        <div class="br">
          <span class="br-label mono" style="font-size:9px">${cause}</span>
          <div class="br-track"><div class="br-seg fail" style="width:${pct(count/totalCauses)}"></div></div>
          <span class="br-val">${count}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AgentScore.session.duration histogram</div>
      <div class="barchart">
      ${buckets.map(b=>{
        const c=all.filter(s=>s.dur>=b.min&&s.dur<b.max).length;
        return`<div class="br">
          <span class="br-label">${b.l}</span>
          <div class="br-track"><div class="br-seg accent" style="width:${pct(c/maxBucket)}"></div></div>
          <span class="br-val">${c}</span>
        </div>`;
      }).join('')}
      </div>
    </div>
  </div>
</div>`;
}

// ═══════════════════════════════════════════════════════
//  RE-EVALUATE
// ═══════════════════════════════════════════════════════
function reEval(btn,sid){
  btn.disabled=true;btn.innerHTML='<span class="spin">⟳</span> Evaluating…';
  setTimeout(()=>{
    btn.disabled=false;btn.innerHTML='⟳ Re-evaluate';
    const n=document.createElement('div');
    n.style.cssText='position:fixed;bottom:22px;right:22px;background:var(--surface2);border:1px solid var(--pass-border);border-radius:8px;padding:11px 16px;font-size:12px;color:var(--text);z-index:999;animation:fadein .2s ease';
    n.innerHTML='<span class="c-pass">✓</span> Re-evaluation complete · Verdict unchanged';
    document.body.appendChild(n);setTimeout(()=>n.remove(),3000);
  },2800);
}

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
