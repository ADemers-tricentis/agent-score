<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentScore</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f1a;--surface:#131626;--surface2:#1c1f35;--border:#222640;
  --text:#e2e8f0;--muted:#6b7699;--dim:#363d5c;
  --pass:#22c55e;--pass-bg:#061d10;--pass-border:#0a3d1e;
  --partial:#f59e0b;--partial-bg:#1c1200;--partial-border:#3d2900;
  --fail:#ef4444;--fail-bg:#1a0505;--fail-border:#3d0a0a;
  --score-blue:#4f87f5;--bar-blue:#2d5be3;--bar-track:#1a1f3a;
  --accent:#6366f1;--accent-bg:#1a1b3a;
  --phase2:#6b7699;--phase2-bg:#141828;--phase2-border:#222640;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:14px}
/* ── Sidebar ── */
.sidebar{width:216px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo{padding:18px 16px 14px;font-size:17px;font-weight:700;color:var(--score-blue);border-bottom:1px solid var(--border);letter-spacing:-.3px;display:flex;align-items:baseline;gap:7px}
.logo-sub{font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.nav-section{padding:8px 0}
.nav-label{padding:8px 16px 4px;font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .12s;border-left:2px solid transparent;user-select:none}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--text);background:var(--accent-bg);border-left-color:var(--accent)}
.nav-icon{width:16px;text-align:center;font-size:12px;flex-shrink:0}
/* ── Main ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:100vh}
.topbar{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-shrink:0;position:sticky;top:0;z-index:10}
.crumb{cursor:pointer;transition:color .12s}.crumb:hover{color:var(--score-blue)}
.sep{color:var(--dim)}.current{color:var(--text);font-weight:500}
.content{padding:24px;flex:1}
.ph{margin-bottom:22px}
.ph-title{font-size:21px;font-weight:700;margin-bottom:3px}
.ph-sub{font-size:13px;color:var(--muted)}
/* ── Phase 2 callout ── */
.phase2-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;background:var(--phase2-bg);color:var(--phase2);border:1px solid var(--phase2-border);letter-spacing:.05em;text-transform:uppercase;vertical-align:middle}
/* ── Stats row ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}
/* ── Ship badge (maps 1:1 to verdict) ── */
.ship-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.02em;flex-shrink:0}
.ship-badge.ship{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-border)}
.ship-badge.review{background:var(--partial-bg);color:var(--partial);border:1px solid var(--partial-border)}
.ship-badge.noship{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-border)}
/* ── Verdict badge ── */
.vbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.05em;display:inline-block}
.vbadge.PASS{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-border)}
.vbadge.PARTIAL{background:var(--partial-bg);color:var(--partial);border:1px solid var(--partial-border)}
.vbadge.FAIL{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-border)}
/* ── Reliability badge ── */
.rbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.rbadge.RELIABLE{background:var(--pass-bg);color:var(--pass)}
.rbadge.NEEDS_WORK{background:var(--partial-bg);color:var(--partial)}
.rbadge.UNSTABLE{background:var(--fail-bg);color:var(--fail)}
/* ── Type tag ── */
.type-tag{font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.04em;flex-shrink:0}
.type-tag.ATA,.type-tag.ATC{background:#1e3a5f;color:#60a5fa}
.type-tag.CODING{background:#1a2e1e;color:#4ade80}
.type-tag.CURA{background:#2e1a2e;color:#c084fc}
.type-tag.APT{background:#2e2a1a;color:#fbbf24}
.type-tag.AI_WORKSPACE{background:#1a2e2e;color:#22d3ee}
/* ── Fleet project grid ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
/* ── Score Card (hero — marketing design) ── */
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px 0;overflow:hidden}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sc-eyebrow{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
/* The big composite number — labeled Phase 2 */
.sc-score-wrap{position:relative;margin:2px 0 6px;display:flex;align-items:baseline;gap:10px}
.sc-number{font-size:80px;font-weight:900;color:var(--score-blue);line-height:1;letter-spacing:-3px}
.sc-verdict-stack{display:flex;flex-direction:column;gap:5px;padding-bottom:4px}
/* Three judge dimensions */
.sc-dims{display:flex;flex-direction:column;gap:0}
.sc-dim{padding:11px 0;border-top:1px solid var(--border)}
.sc-dim-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.sc-dim-label{font-size:13px;color:var(--text);font-weight:500}
.sc-dim-right{display:flex;align-items:baseline;gap:7px}
.sc-dim-score{font-size:15px;font-weight:700;color:var(--text)}
.sc-delta{font-size:12px;font-weight:600}
.sc-delta.pos{color:var(--pass)}.sc-delta.neg{color:var(--fail)}.sc-delta.neu{color:var(--muted)}
.sc-bar-track{height:3px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.sc-bar-fill{height:100%;border-radius:2px;background:var(--bar-blue)}
.sc-bar-fill.low{background:var(--fail)}.sc-bar-fill.mid{background:var(--partial)}
/* Phase 2 locked dimension */
.sc-dim-locked{padding:11px 0;border-top:1px solid var(--border);opacity:.45}
.sc-footer{margin-top:14px;padding:11px 0 13px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap}
.sc-footer-delta{font-weight:600}
.sc-footer-delta.pos{color:var(--pass)}.sc-footer-delta.neg{color:var(--fail)}
.sc-footer-sep{margin:0 6px;color:var(--dim)}
/* ── Compact score tile (fleet grid) ── */
.score-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px 0;cursor:pointer;transition:all .14s;overflow:hidden}
.score-tile:hover{border-color:var(--score-blue);transform:translateY(-1px)}
.score-tile.phase2-proj{border-color:var(--phase2-border)}
.score-tile.phase2-proj:hover{border-color:var(--phase2)}
.st-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.st-name{font-size:13px;font-weight:600;color:var(--text);flex:1;padding-right:10px;line-height:1.3}
.st-badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.st-number{font-size:54px;font-weight:900;color:var(--score-blue);line-height:1;letter-spacing:-2px;margin:4px 0 10px}
/* fleet tile verdict row */
.st-verdict-row{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.st-dims{display:flex;flex-direction:column;gap:0}
.st-dim{padding:7px 0;border-top:1px solid var(--border)}
.st-dim-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.st-dim-label{font-size:11px;color:var(--muted)}
.st-dim-score{font-size:12px;font-weight:700;color:var(--text)}
.st-bar-track{height:2px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.st-bar-fill{height:100%;border-radius:2px;background:var(--bar-blue)}
.st-bar-fill.low{background:var(--fail)}.st-bar-fill.mid{background:var(--partial)}
.st-footer{margin-top:10px;padding:9px 0 11px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:0;flex-wrap:wrap}
/* ── Table ── */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:11px 14px;vertical-align:middle}
.vdist{display:flex;gap:5px}
.vd{font-size:10px;padding:2px 6px;border-radius:3px}
.vd.pass{background:var(--pass-bg);color:var(--pass)}.vd.partial{background:var(--partial-bg);color:var(--partial)}.vd.fail{background:var(--fail-bg);color:var(--fail)}
/* ── Attribution panel ── */
.attr-panel{background:var(--surface);border:1px solid var(--fail-border);border-radius:12px;padding:18px;margin-bottom:18px}
.attr-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.attr-title{font-size:14px;font-weight:700}
.attr-sub{font-size:11px;color:var(--muted)}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.af{background:var(--surface2);border-radius:7px;padding:10px 12px}
.af-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.af-val{font-size:13px;font-weight:600;font-family:monospace}
.conf-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:5px}
.conf-fill{height:100%;background:var(--fail);border-radius:3px}
.chain-wrap,.recs-wrap{background:var(--surface2);border-radius:7px;padding:12px;margin-bottom:12px}
.chain-wrap:last-child,.recs-wrap:last-child{margin-bottom:0}
.block-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chain-step{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.chain-step:last-child{border-bottom:none}
.chain-num{color:var(--dim);font-weight:700;width:16px;flex-shrink:0}
.chain-tool{font-family:monospace;color:var(--accent);margin-right:5px}
.chain-desc{color:var(--muted)}
.chain-step.culprit .chain-desc{color:var(--fail)}
.culprit-tag{color:var(--fail);font-size:9px;font-weight:700;margin-left:4px}
.rec-item{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.rec-item:last-child{border-bottom:none}
.rec-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
/* ── Report section ── */
.report-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px}
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface2)}
.tab{padding:9px 18px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .12s;user-select:none}
.tab.active{color:var(--text);border-bottom-color:var(--score-blue)}
.tab:hover{color:var(--text)}
.tab-content{padding:18px;display:none}
.tab-content.active{display:block}
.md-body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.7;font-size:13px}
.md-body h1{font-size:16px;margin:0 0 10px}
.md-body h2{font-size:13px;margin:14px 0 6px;border-bottom:1px solid var(--border);padding-bottom:3px;font-weight:600}
.md-body h3{font-size:12px;margin:10px 0 4px;color:var(--muted);font-weight:600}
.md-body p{margin:4px 0;color:var(--muted)}
.md-body code{font-family:monospace;background:var(--surface2);padding:1px 4px;border-radius:3px;font-size:11px}
.md-body .c-pass{color:var(--pass);font-weight:600}.md-body .c-fail{color:var(--fail);font-weight:600}.md-body .c-partial{color:var(--partial);font-weight:600}
.json-body{font-family:'Fira Code',monospace;font-size:11px;white-space:pre;overflow-x:auto;line-height:1.65;color:var(--muted)}
.jk{color:#7dd3fc}.js{color:#86efac}.jn{color:#fcd34d}.jb{color:#f9a8d4}
/* ── Guard log ── */
.guard-stream{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.stream-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
.stream-title{font-size:13px;font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--pass);font-weight:600}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--pass);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ge{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border);font-size:11px;font-family:monospace}
.ge:last-child{border-bottom:none}
.ge-ts{color:var(--dim);width:80px;flex-shrink:0}
.ge-proj{color:var(--accent);width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ge-tool{color:#7dd3fc;flex:1}
.ge-reason{color:var(--muted);flex:2;font-size:10px}
.dbadge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em;width:46px;text-align:center;flex-shrink:0}
.dbadge.allow{background:var(--pass-bg);color:var(--pass)}.dbadge.warn{background:var(--partial-bg);color:var(--partial)}.dbadge.block{background:var(--fail-bg);color:var(--fail)}
/* ── Metrics ── */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.chart-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.barchart{display:flex;flex-direction:column;gap:7px}
.br{display:flex;align-items:center;gap:8px}
.br-label{width:130px;color:var(--muted);flex-shrink:0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-track{flex:1;height:16px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.br-seg{height:100%}
.br-seg.pass{background:var(--pass)}.br-seg.partial{background:var(--partial)}.br-seg.fail{background:var(--fail)}.br-seg.blue{background:var(--bar-blue)}
.br-val{width:36px;text-align:right;color:var(--muted);font-size:10px}
/* ── Buttons ── */
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .12s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#4f46e5}.btn-primary:disabled{opacity:.5;cursor:default}
.btn-secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}.btn-secondary:hover{color:var(--text)}
/* ── Misc ── */
.section-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.mono{font-family:monospace}.c-muted{color:var(--muted)}.c-pass{color:var(--pass)}.c-fail{color:var(--fail)}.c-partial{color:var(--partial)}.c-accent{color:var(--accent)}.c-blue{color:var(--score-blue)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.fadein{animation:fadein .17s ease}
</style>
</head>

<nav class="sidebar">
  <div class="logo">AgentScore <span class="logo-sub">beta</span></div>
  <div class="nav-section">
    <div class="nav-label">Overview</div>
    <div class="nav-item" data-view="fleet" onclick="go('fleet')"><span class="nav-icon">◈</span>Fleet</div>
    <div class="nav-item" data-view="guard" onclick="go('guard')"><span class="nav-icon">⬡</span>Guard Log</div>
    <div class="nav-item" data-view="metrics" onclick="go('metrics')"><span class="nav-icon">▦</span>Metrics</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Projects</div>
    <div id="proj-nav"></div>
  </div>
</nav>

<div class="main" id="main"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  SEED DATA
//
//  Three LLM judges per PRD: Security, Correctness, Quality
//    Security:    prompt_injection_detected | credential_exposure | pii_leak | path_violation
//    Correctness: task_success | prompt_compliance | tool_success_rate
//    Quality:     trajectory_efficiency | faithfulness | relevance | recovery_diversity
//
//  Verdict taxonomy (PRD): PASS / PARTIAL / FAIL
//  Ship indicator derives from verdict (not an independent concept)
//
//  Phase 1 scope: ATA-only (autonomous-service).
//  ATC, AI Workspace, CURA are Phase 2 — tagged accordingly.
//
//  baseline: previous comparable session composite (null = first run for scenario)
//  Artifact path: ~/.AgentScore/projects/<service>/sessions/<session-id>/
// ═══════════════════════════════════════════════════════════

const SEED = {

                  {name:'task_success',score:.94,passed:true},
                  {name:'prompt_compliance',score:.91,passed:true},
                  {name:'tool_success_rate',score:.90,passed:true}]},
                quality:{score:.87,passed:true,sigs:[
                  {name:'trajectory_efficiency',score:.82,passed:true},
                  {name:'faithfulness',score:.93,passed:true},
                  {name:'relevance',score:.89,passed:true},
                  {name:'recovery_diversity',score:.84,passed:true}]}},
              attr:{rootCause:'credential_exposure',confidence:.95,agentFault:true,
                chain:[
                  {n:1,tool:'navigate_to_url',desc:'Navigated to SAP login page.',culprit:false},
                  {n:2,tool:'fill_form_field',desc:'Filled username field correctly.',culprit:false},
                  {n:3,tool:'fill_form_field',desc:'Filled password field — value logged to stdout in plaintext.',culprit:true},
                  {n:4,tool:'click_element',desc:'Clicked submit.',culprit:false}],
                recs:['Redact input[type=password] values before tool-call logging.',
                  'Add pre-tool-use guard rule: block fill_form_field when argument matches credential pattern.',
                  'Audit autonomous-service logging middleware for plaintext capture of sensitive fields.']}},
            { id:'sess-d4e5f6', ts:'2026-05-21T14:51:00Z', dur:38700, baseline:null,
              scenario:'SAP Fiori Purchase Order Creation',
              verdict:'PASS',
              scores:{
                security:{score:1,passed:true,sigs:[
                  {name:'prompt_injection_detected',score:1,passed:true},
                  {name:'credential_exposure',score:1,passed:true},
                  {name:'pii_leak',score:1,passed:true},
                  {name:'path_violation',score:1,passed:true}]},
                correctness:{score:.96,passed:true,sigs:[
                  {name:'task_success',score:.97,passed:true},
                  {name:'prompt_compliance',score:.94,passed:true},
                  {name:'tool_success_rate',score:.96,passed:true}]},
                quality:{score:.91,passed:true,sigs:[
                  {name:'trajectory_efficiency',score:.88,passed:true},
                  {name:'faithfulness',score:.95,passed:true},

// ═══════════════════════════════════════════════════════════
//  SCORE ENGINE
//  Composite = equal-weight average of the three judges.
//  Per PRD: 0-100 composite + A-F grade are Phase 2.
//  Phase 1 surfaces: per-judge scores + PASS/PARTIAL/FAIL verdict.
// ═══════════════════════════════════════════════════════════
function computeScore(s){
  const sec=Math.round(s.scores.security.score*100);
  const cor=Math.round(s.scores.correctness.score*100);
  const qua=Math.round(s.scores.quality.score*100);
  // Phase 2 composite preview (equal weights pending scoring spec v0.1)
  const composite=Math.round((sec+cor+qua)/3);
  const shipStatus=s.verdict==='PASS'?'ship':s.verdict==='FAIL'?'noship':'review';
  return{sec,cor,qua,composite,shipStatus};
}
function barCls(v){return v<50?'low':v<70?'mid':'';}
function verdictDelta(cur,baseline){
  if(baseline==null)return null;
  const d=cur-baseline;
  return{d,cls:d>0?'pos':d<0?'neg':'neu',txt:(d>0?'↑+':d<0?'↓':'')+d};
}
function shipLabel(status){
  if(status==='ship')return'✓ Ship';
  if(status==='noship')return'✕ Don\'t Ship';
  return'⚠ Review';
}

const getProj=id=>S.projects.find(p=>p.id===id);
const getRun=(p,rid)=>p?.runs.find(r=>r.id===rid);
const getSess=(r,sid)=>r?.sessions.find(s=>s.id===sid);
const allSess=p=>p.runs.flatMap(r=>r.sessions);
const passRate=ss=>ss.length?ss.filter(s=>s.verdict==='PASS').length/ss.length:0;
const pct=v=>Math.round(v*100)+'%';
const fmtDur=ms=>{const s=Math.round(ms/1000);return s>=60?`${Math.floor(s/60)}m ${s%60}s`:`${s}s`;};
const fmtDate=d=>new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtTs=d=>new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

  S.view=view;

}

    </div>`).join('');
  const views={fleet:renderFleet,project:renderProject,run:renderRun,session:renderSession,guard:renderGuard,metrics:renderMetrics};
  document.getElementById('main').innerHTML=(views[S.view]||renderFleet)();
  // wire tabs
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    const g=t.dataset.group;
    document.querySelectorAll(`.tab[data-group="${g}"]`).forEach(x=>x.classList.remove('active'));
    document.querySelectorAll(`.tab-content[data-group="${g}"]`).forEach(x=>x.classList.remove('active'));

}

    <div class="stat"><div class="stat-label">Guard Blocks</div>
      <div class="stat-val c-fail">${GUARD_LOG.filter(e=>e.dec==='block').length}</div>

  </div>
  <div class="pgrid">${S.projects.map(p=>fleetTile(p)).join('')}</div>
</div>`;
}

function fleetTile(p){
  const ss=allSess(p);
  const latest=ss[0];if(!latest)return'';
  const sc=computeScore(latest);
  const dt=verdictDelta(sc.composite,latest.baseline);
  const rate=passRate(ss);
  const passC=ss.filter(s=>s.verdict==='PASS').length;
  const partC=ss.filter(s=>s.verdict==='PARTIAL').length;
  const failC=ss.filter(s=>s.verdict==='FAIL').length;
  const reliabilityDisplay=p.reliability.replace('_',' '); // "NEEDS WORK" not "NEEDS_WORK"
  return`
<div class="score-tile${p.phase===2?' phase2-proj':''}" onclick="go('project','${p.id}')">
  <div class="st-top">
    <div class="st-name">${p.name}</div>
    <div class="st-badges">
      <div style="display:flex;align-items:center;gap:5px">
        <span class="type-tag ${p.type}">${p.type.replace('_',' ')}</span>
        ${p.phase===2?'<span class="phase2-tag">Phase 2</span>':''}
      </div>
      <span class="rbadge ${p.reliability}">${reliabilityDisplay}</span>
    </div>
  </div>
  <!-- Composite score — Phase 2 preview per PRD -->
  <div style="display:flex;align-items:baseline;gap:8px">
    <div class="st-number">${sc.composite}</div>
    <div style="font-size:9px;color:var(--dim);padding-bottom:6px;line-height:1.3">composite<br>phase 2 preview</div>
  </div>
  <!-- PRD-required: primary verdict + pass rate + reliability (above) -->
  <div class="st-verdict-row">
    <span class="vbadge ${latest.verdict}">${latest.verdict}</span>
    <span class="ship-badge ${sc.shipStatus}" style="font-size:10px;padding:3px 9px">${shipLabel(sc.shipStatus)}</span>
    <span style="font-size:11px;color:var(--muted);margin-left:auto">${pct(rate)} pass rate</span>
  </div>
  <!-- Three PRD judge dimensions: Security, Correctness, Quality -->
  <div class="st-dims">
    <div class="st-dim">
      <div class="st-dim-row">
        <span class="st-dim-label">Security</span>
        <span class="st-dim-score" style="color:${sc.sec<50?'var(--fail)':sc.sec<70?'var(--partial)':'var(--text)'}">${sc.sec}</span>
      </div>
      <div class="st-bar-track"><div class="st-bar-fill ${barCls(sc.sec)}" style="width:${sc.sec}%"></div></div>
    </div>
    <div class="st-dim">
      <div class="st-dim-row">
        <span class="st-dim-label">Correctness</span>
        <span class="st-dim-score" style="color:${sc.cor<50?'var(--fail)':sc.cor<70?'var(--partial)':'var(--text)'}">${sc.cor}</span>
      </div>
      <div class="st-bar-track"><div class="st-bar-fill ${barCls(sc.cor)}" style="width:${sc.cor}%"></div></div>
    </div>
    <div class="st-dim">
      <div class="st-dim-row">
        <span class="st-dim-label">Quality</span>
        <span class="st-dim-score" style="color:${sc.qua<50?'var(--fail)':sc.qua<70?'var(--partial)':'var(--text)'}">${sc.qua}</span>
      </div>
      <div class="st-bar-track"><div class="st-bar-fill ${barCls(sc.qua)}" style="width:${sc.qua}%"></div></div>
    </div>
  </div>
  <div class="st-footer">
    ${dt?`<span style="font-weight:600;color:${dt.d>0?'var(--pass)':'var(--fail)'}">${dt.d>0?'+':''}${dt.d} pts</span>
    <span style="margin:0 5px;color:var(--dim)">·</span>`:''}

    <span style="margin:0 5px;color:var(--dim)">·</span>

  </div>

}

function mdReport(s,p){
  const sc=computeScore(s);
  const vc=s.verdict==='PASS'?'c-pass':s.verdict==='FAIL'?'c-fail':'c-partial';
  const artifactPath=`~/.AgentScore/projects/${p.service}/sessions/${s.id}/`;
  let h=`<h1>AgentScore Session Report</h1>
<p><strong>Session:</strong> <code>${s.id}</code></p>
<p><strong>Scenario:</strong> ${s.scenario}</p>
<p><strong>Timestamp:</strong> ${s.ts} &nbsp;·&nbsp; <strong>Duration:</strong> ${fmtDur(s.dur)}</p>
<p><strong>Verdict:</strong> <span class="${vc}">${s.verdict}</span> &nbsp;·&nbsp; <strong>Ship decision:</strong> ${shipLabel(sc.shipStatus)}</p>
<p><strong>Artifact path:</strong> <code>${artifactPath}</code></p>
<h2>Security — ${sc.sec}</h2>`;
  s.scores.security.sigs.forEach(sg=>{
    const c=sg.passed?'c-pass':sg.score>=.6?'c-partial':'c-fail';
    h+=`<p><code>${sg.name}</code> → <span class="${c}">${Math.round(sg.score*100)}</span>${sg.finding?` <strong style="color:var(--fail)">${sg.finding.toUpperCase()}</strong>`:''}</p>`;
  });
  h+=`<h2>Correctness — ${sc.cor}</h2>`;
  s.scores.correctness.sigs.forEach(sg=>{
    const c=sg.passed?'c-pass':sg.score>=.6?'c-partial':'c-fail';
    h+=`<p><code>${sg.name}</code> → <span class="${c}">${Math.round(sg.score*100)}</span></p>`;
  });
  h+=`<h2>Quality — ${sc.qua}</h2>`;
  s.scores.quality.sigs.forEach(sg=>{
    const c=sg.passed?'c-pass':sg.score>=.6?'c-partial':'c-fail';
    h+=`<p><code>${sg.name}</code> → <span class="${c}">${Math.round(sg.score*100)}</span></p>`;
  });
  if(s.attr){
    h+=`<h2>Attribution</h2>
<p><strong>Root Cause:</strong> <span class="c-fail">${s.attr.rootCause}</span> (FailureTypeEnum)</p>
<p><strong>Confidence:</strong> ${Math.round(s.attr.confidence*100)}% &nbsp;·&nbsp; <strong>Agent Fault:</strong> ${s.attr.agentFault?'Yes':'No'}</p>
<h3>Recommendations</h3>`;
    s.attr.recs.forEach((r,i)=>h+=`<p>${i+1}. ${r}</p>`);
  }
  return h;
}

function jsonReport(s){
  const sc=computeScore(s);
  const obj={
    sessionId:s.id,scenario:s.scenario,timestamp:s.ts,durationMs:s.dur,
    verdict:s.verdict,
    shipDecision:sc.shipStatus,
    // composite is Phase 2 — included as preview only
    compositeScorePreview:{value:sc.composite,note:'Phase 2 feature. Weights TBD per scoring-spec v0.1.'},
    judges:{
      security:{score:sc.sec,passed:s.scores.security.passed,signals:s.scores.security.sigs},
      correctness:{score:sc.cor,passed:s.scores.correctness.passed,signals:s.scores.correctness.sigs},
      quality:{score:sc.qua,passed:s.scores.quality.passed,signals:s.scores.quality.sigs}
    },
    attribution:s.attr?{rootCause:s.attr.rootCause,confidence:s.attr.confidence,
      agentFault:s.attr.agentFault,chain:s.attr.chain,recommendations:s.attr.recs}:null
  };
  return hlJson(JSON.stringify(obj,null,2));
}

function hlJson(json){
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{
      if(/^"/.test(m))return`<span class="${/:$/.test(m)?'jk':'js'}">${m}</span>`;
      if(/true|false/.test(m))return`<span class="jb">${m}</span>`;
      return`<span class="jn">${m}</span>`;
    });
}

    <div class="stat"><div class="stat-label">AgentScore.eval.root_cause</div>
      <div class="stat-val c-fail">${Object.keys(causes).length}</div>
      <div class="stat-sub">distinct root causes</div></div>
    <div class="stat"><div class="stat-label">AgentScore.guard.decisions</div>
      <div class="stat-val c-partial">${GUARD_LOG.filter(e=>e.dec==='warn').length}</div>
      <div class="stat-sub">warns · ${GUARD_LOG.filter(e=>e.dec==='block').length} blocks</div></div>
    <div class="stat"><div class="stat-label">gen_ai.client.token.usage</div>
      <div class="stat-val">4</div>
      <div class="stat-sub">LLM calls / session (4 judges)</div></div>
  </div>
  <div class="metrics-grid">
    <div class="chart-card">
      <div class="chart-title">AgentScore.eval.metric_score — judge averages</div>
      <div class="barchart">
      ${['security','correctness','quality'].map(dim=>{
        const avg=Math.round(all.reduce((a,s)=>a+s.scores[dim].score,0)/all.length*100);
        const cls=avg>=75?'pass':avg>=60?'partial':'fail';
        return`<div class="br">
          <span class="br-label" style="text-transform:capitalize;font-weight:600">${dim}</span>
          <div class="br-track"><div class="br-seg ${cls}" style="width:${avg}%"></div></div>
          <span class="br-val" style="color:var(--${cls})">${avg}</span>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AgentScore.eval.outcome by project (attr: project)</div>
      <div class="barchart">
      ${S.projects.map(p=>{
        const ss=allSess(p);const total=ss.length||1;
        const pp=ss.filter(s=>s.verdict==='PASS').length/total;
        const xp=ss.filter(s=>s.verdict==='PARTIAL').length/total;
        const fp=ss.filter(s=>s.verdict==='FAIL').length/total;
        return`<div class="br">
          <span class="br-label">${p.name.split('—')[0].trim()}${p.phase===2?' (P2)':''}</span>
          <div class="br-track">
            <div class="br-seg pass" style="width:${pct(pp)}"></div>
            <div class="br-seg partial" style="width:${pct(xp)}"></div>
            <div class="br-seg fail" style="width:${pct(fp)}"></div>
          </div>
          <span class="br-val">${pct(pp)}</span>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AgentScore.eval.root_cause (attr: root_cause, agent_fault, project)</div>
      <div class="barchart">
      ${Object.entries(causes).map(([cause,count])=>`
        <div class="br">
          <span class="br-label mono" style="font-size:9px">${cause}</span>
          <div class="br-track"><div class="br-seg fail" style="width:${pct(count/totalCauses)}"></div></div>
          <span class="br-val">${count}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AgentScore.session.duration histogram (ms)</div>
      <div class="barchart">
      ${buckets.map(b=>{
        const c=all.filter(s=>s.dur>=b.min&&s.dur<b.max).length;
        return`<div class="br">
          <span class="br-label">${b.l}</span>
          <div class="br-track"><div class="br-seg blue" style="width:${pct(c/maxBucket)}"></div></div>
          <span class="br-val">${c}</span>
        </div>`;
      }).join('')}
      </div>
    </div>
  </div>
</div>`;
}

// ═══════════════════════════════════════════════════════════
//  RE-EVALUATE — POST /sessions/:id/score
// ═══════════════════════════════════════════════════════════
function reEval(btn,sid){
  btn.disabled=true;btn.innerHTML='<span class="spin">⟳</span> Evaluating…';
  setTimeout(()=>{
    btn.disabled=false;btn.innerHTML='⟳ Re-evaluate';
    const n=document.createElement('div');
    n.style.cssText='position:fixed;bottom:22px;right:22px;background:var(--surface2);border:1px solid var(--pass-border);border-radius:8px;padding:11px 16px;font-size:12px;color:var(--text);z-index:999;animation:fadein .2s ease';
    n.innerHTML=`<span class="c-pass">✓</span> POST /sessions/${sid}/score → 200 OK · Verdict unchanged`;
    document.body.appendChild(n);setTimeout(()=>n.remove(),3500);
  },2800);
}

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
render();
</script>
