### Choose what your coding agent is allowed to do
- On Integrations, you can turn off groups of actions for your own connection, or stop every coding agent.
- The groups are Read, Change, Spend credits, Delete & credentials, and Prompts & guides.
- A Tricentis admin can turn a group off for the whole account. You cannot turn that group back on. A call that is off tells the agent it is not allowed.

### Secrets in a trace stay out of your coding agent
- Recognisable API keys, tokens, and passwords are replaced before your coding agent reads a trace, a span, or a search result.
- The trace in the app is unchanged, so scoring still uses the original text.
- Results that include text from your traces now open and close with a notice that the text is untrusted. A copy of that notice planted in the text cannot pose as the end of the result.

### Fixes
- Judge calls on Claude Sonnet 5 now have a price. Those calls were recorded with none.

### Internal note: Insights is easier to hand to a coding agent
- Export is a zip instead of a one-tab spreadsheet: overview, accounts, timelines, journeys, friction, value, attention, and day or week series, with a data dictionary and a starter prompt.
- A wizard sets contents, filters, and whether names are replaced. The file is built in short pieces so other screens stay responsive.
- Routine coverage sits in the toolbar. A banner appears only for a real gap. Participant counts no longer depend on a secret that was never set, which had marked every report unavailable, and a period that starts before recording began says so.

### Internal note: a model still in use cannot be removed out from under scoring
- Changing or removing a model that an agent version is still set to use is refused. An in-place edit had left scoring with no model to call.

### Internal note: large traces and large fleets stay responsive
- Opening a large trace no longer holds every other request while the page is built.
- The back-office dashboard no longer fails once a region has more than 32,767 agents.

### Coming next
- Cutting agent tracing over to push directly from internal agents instead of pulling from Better Stack
- Promoting the API gateway build and the firewall change so the coding-agent connection works in production

## October 29, 2026 Update

### Your coding agent can reach AI Workspace agents
- A connected coding agent used to list only the agents on your external account. It now includes the AI Workspace agents you already see in the app, and each one is marked AI Workspace or external.
- A request about one agent runs in the account that holds that agent.

### Check a change from the same connection
- When a trace fails, the agent can list only the failed spans.
- You can mark when a change started, then compare the new score with the run from before it.
- A cancelled run is released immediately, so a new run can start.

### Clearer connect steps, and a warning if the link was forwarded
- The server URL now appears in the step where you paste it, for Claude, Codex, and other clients, with the connector name in its own copy block.
- The setup guide states that the connected agent can read and change agents, labels, and checks, revoke an ingest key, and start scoring. Those actions run immediately, and scoring stays capped on the server.
- If someone sends you a connect link for Claude on the web or Cursor on the web, the consent page warns you to deny it unless you started the connection yourself. Allowing it lets that account act as you.

### Claude 5.5 models respond
- Scoring, chat, improvement advice, and a connection test now succeed on Claude Sonnet 5.5 and Opus 5.5. Those calls were failing.
- New environments start on Sonnet 5.5. An account that already has a model keeps it until you switch.

### Fixes
- Approving the coding-agent connection no longer ends with "Agent Score could not complete this step."
- Scoring a single trace, or resuming a run, now stops when the account is out of credits.

### Internal note: adoption Insights in the back office
- Operators can see regional adoption, where a workflow stalls, and a read-only account investigation. The page does not read customer content or change customer settings.
- It opens on an overview and sits ahead of Reports, with its own icon.

### Internal note: memory stays bounded on large traces
- Ingest, the scoring worker, and the usage export now read and write in bounded batches, after a production ingest pod was killed by an unbounded trace merge.

- The Integrations page now walks through setup for Claude Code, Cursor, Codex, and Claude. Sign-in happens in your browser.

## September 24, 2026 Update

### Tune ship/no-ship thresholds for each agent
- Ship, Ship with note, Needs work, and Don't ship thresholds used to be fixed for every agent under a profile - moving one agent's thresholds meant changing them for everyone on that profile. You (or a Tricentis admin) can now override those thresholds for a single agent, with a clear label showing whether it's using your custom values or the profile default.
- Resetting back to the profile default is one click.

### See your AI credits at a glance, everywhere
- Your credits balance now shows on every page, not just when you're looking at a specific agent, so you always know where your account stands.
- Running low or out of credits now shows a clear banner explaining why and who to contact - and any action that would spend credits (scoring, chat, advice, and more) is disabled with a plain-language reason until credits are available again.

### A clearer way to accept our terms
- The terms you accept before using Agent Score are now written and managed directly by Tricentis instead of routing through a separate upstream service.
- The acceptance screen is also redesigned to fill your window, so you can read and scroll through the full document without fighting a second, undersized scrollbar.

### Sign in with your Tosca Cloud account
- You can now sign in to Agent Score with your existing Tosca Cloud account instead of a separate one-off login.
- If something goes wrong during sign-in (a deactivated account, a tenant mapping change, a session mismatch) you now see a specific explanation and who can help, instead of a generic "not configured" message.

### Internal note: RDS IAM authentication rolling out
- Postgres connections on our shared infrastructure now mint a short-lived, per-connection IAM token instead of using a static password, gated behind a flag so it can roll out safely one environment at a time.

### Internal note: old AWS deployment lane retired
- The AWS ECS deployment lane, unused since September 15, is fully decommissioned - its workflows, task definitions, and infrastructure are removed. \`/release\` now ships to staging only; promoting to production stays a separate, deliberate step.

### Internal note: clearer environment cues and a reorganized consent view in the back office
- An operator working a dev tab and a staging tab side by side now gets a bigger environment strip, a chip, and a \`[DEV]\`/\`[STG]\`/\`[PROD]\` browser-tab tag, so it's obvious which environment is which.
- The Consent page moved under Users, with a new Acceptances table showing every customer user's terms status across all their tenants in one place instead of checking user by user.

### Internal note: AI Hub usage now bills to the right cause
- Every AI Hub call is now billed to whichever action actually caused it - a customer's own action, our staff acting on their behalf, or automatic scheduled work - instead of bucketing everything under the tenant regardless of who or what triggered it.

### Internal note: back-office tenant overview reorganized around credits and agent health
- The back-office tenant Overview tab now leads with AI credit balance and agent health (active, provisioning, failed counts) in equal-width cards, replacing a stretched credit summary and per-agent tiles that called every non-active agent "dormant."
- The tenant list also gained an AI credits column, so an operator can see a tenant's balance without opening it.

## September 23, 2026 Update

### Manage your whole fleet from one workspace
My Agents is now a full workspace instead of a read-only list.
- Filter and page through your fleet, then dig into Score, Improve, Agent Card, Traces, Profile, and Labeling for any agent - all without waiting on us.
- Set an agent-specific model yourself, so an agent can run on the model that fits it instead of your account default.
- Deleted an agent by mistake? Restore it yourself - permanent removal is the only step still handled by our team.

### A home base for your fleet
- A new Home page greets you with your fleet's health at a glance - real-agent totals, recent activity, scoring status, and what needs your attention.
- Try Agent Score risk-free with example agents you launch yourself - they're excluded from your real fleet counts and scores, so they never skew what you're actually measuring.

### Talk to your agents from your own workspace
- The chat assistant and full agent-detail experience, previously only available to our team acting on your behalf, are now built directly into your own workspace - ask about an agent's scores and evidence yourself, no back-and-forth required.

### Clearer setup info when you connect an agent
- The Add Agent dialog and your Integrations tab now show the exact ingest endpoint and exporter configuration for your account, with a one-click copy - no more guessing which URL your agent should send traces to.

### Internal note: platform migration to TAIS advances further
- Filled in the staging deployment tier and gated the Kubernetes release pipeline on a staging approval; retired the old AWS ECS deployment entirely now that the Kubernetes lane serves every environment, so \`/release\` ships to staging only from here.
- Fixed a chart-bump race where two of the three TAIS Helm charts could merge concurrently and get rejected; moved the chart-tag source from values files to each chart's release file to match how the shared release pipeline now expects it.
- RDS IAM auth: Postgres connections on TAIS now mint a short-lived, per-connection IAM token instead of a static password, gated behind a flag so it can roll out safely.
- Standardized how TAIS-specific settings (ports, buckets, regions) get derived automatically from a deployment profile instead of being hand-copied into two repositories for every new environment.

### Internal note: Tosca Cloud sign-in and cross-tenant auth
- Built the full Tosca Cloud customer sign-in flow behind the TAIS gateway - tenant mapping, consent, token renewal, and admin revocation controls - and exercised it against real sign-in attempts on TAIS dev, fixing bugs it surfaced along the way (an unmapped tenant refusing every customer, a staff/customer email conflict).
- A Tricentis staff member who's also an Agent Score customer can now hold one login for each without the two accounts colliding.
- Expanded browser-test coverage of customer flows, including the Tosca sign-in states and the controls that spend model money, since those paths were previously barely tested.

### Internal note: model calls on TAIS now route through the Tricentis AI Hub
- Every model call made while scoring on TAIS now goes through the Tricentis AI Hub with PayGo metering, so usage is billed to the correct customer tenant instead of hitting Bedrock directly with no metering at all.
- Fixed a permissions bug that silently zeroed out billed model calls on external tenants right after this switch.

### Internal note: engineering process and CI hardening
- Every merge into the product repo now enforces branch/commit/PR naming conventions through a shared lint check, whether a human or an AI coding agent opens the pull request.
- Pinned all 44 third-party GitHub Actions to commit hashes instead of floating version tags, so a moved tag can no longer silently change what a deploy or release workflow executes.
- Routine dependency bumps and CI plumbing (secret-scanner fixes, action version bumps, stale test-assertion fixes) kept the pipeline green.

### Coming next
- Signing in with your existing Tosca Cloud account, so you won't need a separate one-off login just for Agent Score - built and now rolling out on the new infrastructure, launch timing still to be decided

- Agent Score's backend is moving from its current AWS setup onto Tricentis' shared Kubernetes platform (TAIS), including a cutover from Postgres-on-EC2 to Amazon RDS. This is infrastructure work with no visible change for customers yet.
- Staff and Tosca Cloud sign-in are being wired up in parallel on the new infrastructure so Tosca Cloud login (see Coming next) can launch there - the Tosca Cloud path itself is not yet turned on in any environment.
- Along the way: back-office sign-in now leads with Microsoft and flags pending access requests to admins, and a Tricentis staff member who is also an Agent Score customer can now hold one login for each without the two accounts conflicting.

### Coming next
- Signing in with your existing Tosca Cloud account, so you won't need a separate one-off login just for Agent Score

## September 15, 2026 Update

### Switching windows no longer resets your work
- Alt-tabbing away from Agent Score and back used to blank the screen and rebuild the page while it re-checked your session - losing your scroll position, open dialogs, and anything you were mid-typing. It now re-checks quietly in the background and only reloads if your session actually needs it.

### More reliable ingestion when traffic gets uneven
- A single integration sending unusually slow or high-volume requests could previously eat into the shared capacity other tenants rely on to send traces. Each credential now gets its own fair share, so one noisy or slow sender can no longer crowd out everyone else's traces.

### Internal note: unified Tricentis login (Entra ID)
- Tricentis staff now sign into the Agent Score back office with the same Microsoft Entra ID login used elsewhere at Tricentis, instead of a separate one-off account. Anyone not yet on the access list gets a self-serve "request access" button, and any admin can approve the request and set an access level, no IT ticket needed.

### Coming next
- Signing in with your existing Tosca Cloud account, so you won't need a separate one-off login just for Agent Score

## September 10, 2026 Update

### Talk to Agent Score directly
- The chat assistant is now full-featured - ask about your agents' scores and evidence, and act on what you find, all from one conversation instead of clicking through screens.

### Ask how to make your agent better
- Every scored agent can now generate improvement advice on demand - ask what's holding your score back and get recommendations that trace straight back to the evaluation that drove them.

### Freshly calibrated profiles
- All seven agent profiles got a calibration pass this week for more accurate pass thresholds - if a score moved slightly without your agent's behavior changing, this is likely why.

### More agents to try Agent Score against
- The simulated-agent library grew to 34 ready-to-run agents, so you can see Agent Score in action before connecting your own - and you can now send and score a whole batch of them at once instead of one at a time.

## September 9, 2026 Update

### More accurate run status when scoring can't complete
- If every judge call fails before producing a single verdict (for example, during a provider outage), the run now shows as failed instead of a misleading partial - so you know to retry instead of trusting a result that never actually scored anything.

### Cleaner run results and advice pages
- Scoring-run pages no longer repeat the same evaluation data across tabs - your run's overview and interaction results now show it once, in one place.
- Advice status is now accurate end to end - it no longer looks "ready" before it's actually finished, and it recovers cleanly if a request gets interrupted instead of losing track of what you asked for.

### Coming next
- A conversational assistant for asking questions about your agent's scores directly - built and through internal safety review, launch timing still to be decided
- Score-improvement recommendations that trace back to exactly which score drove them - in development

## September 8, 2026 Update

### More precise agent profiles
- Agent Score now matches your agent against seven specific profiles - Grounded Answerer, Summarizer, Tool Caller, Task Agent, Conversational Assistant, Policy Guardrail, and General Answerer - instead of a smaller, harder-to-fit set. A tighter match means the dimensions and evaluations scoring you are the ones that actually apply to what your agent does.

### Faster, more reliable scoring runs
- Scoring, advisor, and fit runs can now execute in parallel instead of queuing one at a time, so scores come back faster.
- A single trace that can't produce a verdict no longer holds up the rest of the batch - the other traces in the same run keep scoring instead of getting marked incomplete alongside it.
- Turning off automatic scoring for an agent now actually stops it - previously a scheduled re-score could still run (and get billed) even after you'd switched autonomous scoring off.

### Coming next
- A conversational assistant for asking questions about your agent's scores directly - built and through internal safety review, launch timing still to be decided
- Score-improvement recommendations that trace back to exactly which score drove them - in development

## September 4, 2026 Update

### Behind the scenes: scores now hold up no matter how big the trace gets
More progress on the new judge from last update - this closes the two biggest risks to trusting it on real-world traces.
- Scoring no longer has to read an entire trace end to end - it now pulls only the specific evidence it needs to judge each step, so trace size stops being a limiting factor. In one test, a 36 MB trace needed only about 0.2% of its data to reach the correct score.
- Scores are also more consistent run to run. Newer models reason better but can vary slightly between repeated evaluations, so we moved everything that doesn't require judgment out of the model and into dedicated, deterministic checks - leaving the model to focus only on the reasoning that actually needs it.
- Still nothing customer-facing changes yet - the new judge is running side by side with today's scoring engine until validation finishes.

### Faster scores when a trace's root step goes missing
- If a trace's root span never made it in (a truncated or split capture), it used to sit unscored for up to 24 hours before we gave up and forced a result. It now completes within minutes of us detecting the gap, so you see a score much sooner.

### Coming next
- A conversational assistant for asking questions about your agent's scores directly - built and through internal safety review, launch timing still to be decided
- Score-improvement recommendations that trace back to exactly which score drove them - in development

## September 2, 2026 Update

### Behind the scenes: a new judge is coming online
Nothing here changes what you see today - this is the engineering underneath the next wave of scoring improvements.
- Scoring is moving to a new judge that grades directly against the evidence it read, checking specific facts (like the arguments a tool call used, or what a step actually returned) with dedicated verification tools instead of relying on memory
- The new judge is running in parallel with today's scoring engine while we validate it side by side - nothing customer-facing changes until that validation finishes and the old engine is retired
- Fixed a scoring failure mode where certain models rejected a request outright instead of completing it

### Back office: faster manual scoring for our team
- Our team can now score a single trace on demand and see every eval's verdict on one page, instead of waiting on a batch pass - speeds up how quickly we can chase down a customer-reported scoring question

## August 27, 2026 Update

### Better visibility into what powers your scores
We built out an internal LLM catalog so we always know exactly which model handled which task, and what it costs - this keeps routing smart and pricing honest as new models come out.
- Every model we might call, current or retired, now carries real, effective-dated pricing on file, including cache read/write rates
- Fixed a bug that double-billed OpenAI cached tokens - they're already counted inside the total input tokens, but we were also charging them again as a separate cache cost, so the accounting behind our routing and pricing decisions is now accurate
- A new usage and spend report lets our team see what each tenant costs to run, so we can keep AgentScore priced fairly as usage grows

### Faster, sturdier trace pipeline
- Rebuilt how incoming traces get assembled, trimming the delay between when your agent runs and when its trace is ready to score
- Fixed a bug where a single unusual span type could throw out an entire trace instead of just that one piece - so more of what your agent actually did makes it into your score

## August 26, 2026 Update

### More of your traces make it to a score
We closed two gaps between "you sent a trace" and "you got a score for it."
- Fixed an ingestion gap that was silently dropping roughly a third of routed runs before they ever reached the trace store - missing traces should now show up
- If our scoring provider has a brief outage, we no longer record a wrong guess as your permanent score - affected runs are retried instead of silently written wrong

### Faster access to your traces, and answers built into the app
- You can now download an agent's raw traces directly from the Traces tab
- Product docs are no longer a separate site - there's now a Docs tab built into the app, so you don't have to leave the product to find an answer
- Fixed a bug that could block a brand-new account from connecting its very first agent

### Coming next: scoring by session, and profiles built for your agent
- Session-based scoring - so a score reflects a whole interaction, not a fragment of one
- Dynamic scoring profiles - a profile built for what your specific agent needs to get right, instead of the closest fit among nine fixed ones

## August 24, 2026 Update

### Faster, cheaper scoring on a new foundation
We've moved off Langfuse and onto our own trace storage (Postgres + S3), purpose-built for how AgentScore actually uses trace data. The switch is complete and running in production.
- Scoring runs faster and uses meaningfully fewer tokens per run
- One less third-party system in the path between your traces and your score
- Historical traces and scores from before the cutover didn't carry over - we're rebuilding history from here forward on the new foundation. If there's a specific past run you need, reach out and we'll see what's recoverable.

## August 18, 2026 Update

### Ingest keys are now self-serve
Create, rotate, or revoke an ingest key yourself from the Integrations page - no more filing a ticket and waiting on the team to rotate one for you.

### Customer-facing docs are live
The first version of the [AgentScore docs site](https://demers-demos.product.tricentis.com/docs/) has shipped - a self-serve reference covering ingestion, dimensions and profiles, the eval catalog, agent cards, and scoring, so prospects and customers can find answers without waiting on us.
- Every core concept has its own page, illustrated with real product screenshots and purpose-built diagrams
- The eval catalog page shows the deterministic-to-LLM-judged spectrum so users can reason about tradeoffs themselves
- Each page ships as a single self-contained build, so it's easy to host, share, or embed anywhere

### A skill that keeps the docs honest, because we're moving too fast for them to keep up by hand
We're shipping fast enough that something drifts between the docs and the real product almost every week. Rather than wait to find out from a customer, we built a skill that walks the live product against the docs site on demand and fixes what's stale in the same pass. It ran end-to-end for the first time today:
- Caught the self-serve ingest-key change above before it could sit undocumented behind stale instructions
- Corrected the agent status states, the OpenTelemetry setup snippet, and the scheduled-scoring constraints so they match exactly what's live today
- Caught a stray screenshot that had quietly been sourced from an internal design prototype instead of the real product, and swapped it for the real thing
- Every finding - including the handful we chose to leave for later - is now tracked in a standing drift log instead of living in someone's head

## August 14, 2026 Update

### Faster path from connect to first score
Alpha (v0.31.2) is live - the full journey from onboarding to a scored run now works end-to-end.
- New users can simulate traces and see a preview score before they have real production data to connect
- Onboarding is simpler and now open to externally-built agents, not just internal Tricentis ones
- Internal Tricentis agents are picked up and scored automatically based on tenant, with zero setup required

### Widening the door for prospects and testers
- The new Shift Sync page gives prospects a self-serve way to engage before a sales conversation
- Beta click-through flow is underway, turning "request access" into a self-service signup
- Demo videos are in production so prospects, including at Transform, can see the value without a live walkthrough

### Coming next: removing the remaining friction
- AIW integration will surface scores automatically for user-created agents, one less setup step for users
- Onboarding is getting easier to start:
    - Plain-language evaluations (e.g., Tool Use: does the agent choose the right tools, use them efficiently, and recover cleanly from a failed call?), so users don't need AI expertise to understand their score
    - Conversational eval building: describe what you're trying to evaluate, and the scoring agent builds the profile for you
    - Skill-based setup: paste instructions into your AI agent and traces start flowing automatically
- Internal teams get their own onboarding materials, so ramping up doesn't require a 1:1 walkthrough
- More demo agents and synthetic traces, so prospects see a demo that matches their own use case
