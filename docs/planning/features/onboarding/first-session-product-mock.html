<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Score — first session mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --text: hsl(0, 0%, 0%);
    --text2: #52525b;
    --disabled: hsl(240, 5%, 65%);
    --divider: hsl(240, 5%, 84%);
    --paper: #fff;
    --surface: hsl(240, 5%, 96%);
    --hover: hsl(0, 0%, 98%);
    --selected: hsl(210, 100%, 95%);
    --primary: hsl(210, 60%, 47%);
    --primary-dark: hsl(210, 70%, 39%);
    --brand: #004c97;
    --success: hsl(122, 50%, 35%);
    --warning: hsl(23, 80%, 45%);
    --error: hsl(0, 65%, 51%);
    --info: hsl(210, 60%, 47%);
    --card-shadow: 0 2px 1px -1px rgba(0, 0, 0, 0.08), 0 1px 1px 0 rgba(0, 0, 0, 0.06), 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    --dialog-shadow: 0 11px 15px -7px rgba(0, 0, 0, 0.2), 0 24px 38px 3px rgba(0, 0, 0, 0.14), 0 9px 46px 8px rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px; line-height: 20px; letter-spacing: 0.03125rem;
    color: var(--text);
    background: #111418;
    display: flex; flex-direction: column;
  }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  svg.i { display: block; flex-shrink: 0; fill: currentColor; }

  /* Mock-only preview bar */
  .mockbar {
    min-height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; background: #111418; color: #c9cdd3; font-size: 12px;
    letter-spacing: 0; overflow-x: auto;
  }
  .mockbar span, .mockbar strong { white-space: nowrap; flex-shrink: 0; }
  .mockbar strong { color: #fff; font-weight: 600; }
  .mockbar .spacer { flex: 1; }
  .mockbar button {
    background: transparent; border: 1px solid #3a4048; color: #e8eaed;
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; flex-shrink: 0;
  }
  .mockbar button[aria-pressed="true"] { background: #fff; color: #111418; border-color: #fff; }
  #waitbar { display: flex; gap: 8px; margin-left: 8px; }

  /* App shell */
  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
  header.topbar {
    flex-shrink: 0; height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--divider);
  }
  .topbar img { height: 28px; width: auto; user-select: none; }
  .account { display: flex; align-items: center; gap: 8px; }
  .credits {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px;
    border: 1px solid var(--divider); border-radius: 4px; font-size: 12px; letter-spacing: 0.025rem;
  }
  .usermenu { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 4px; color: var(--text2); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: hsl(240, 4%, 26%); color: #fff;
    display: grid; place-items: center; font-size: 13px; font-weight: 500;
  }
  .shell { flex: 1; display: flex; min-height: 0; }
  .rail {
    width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
    padding: 8px; border-right: 1px solid var(--divider); background: var(--paper);
  }
  .panelswitch {
    width: 48px; display: flex; flex-direction: column; gap: 4px; padding: 4px;
    border: 1px solid var(--divider); border-radius: 4px; margin-bottom: 8px;
  }
  .panelswitch button {
    position: relative; width: 40px; height: 40px; border: 0; border-radius: 4px;
    background: transparent; color: var(--text2); display: grid; place-items: center;
  }
  .panelswitch button[aria-pressed="true"] { background: var(--selected); color: var(--primary); }
  .panelswitch button[aria-pressed="true"]::before {
    content: ""; position: absolute; top: 50%; left: -2px; width: 3px; height: 20px;
    border-radius: 2px; background: var(--primary); transform: translateY(-50%);
  }
  .railnav { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .railnav button, .railfoot button {
    width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent;
    color: var(--text2); display: grid; place-items: center;
  }
  .railnav button:hover, .railfoot button:hover { background: var(--hover); }
  .railnav button[aria-current="page"] { background: var(--selected); color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
  .railnav button:disabled { cursor: default; }

  main { flex: 1; min-width: 0; overflow: auto; background: var(--paper); }
  .band { padding: 32px 32px 20px; }
  .content { padding: 0 32px 32px; display: flex; flex-direction: column; gap: 24px; }
  .pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .titlerow { display: flex; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 1.375rem; line-height: 1.75rem; font-weight: 400; letter-spacing: 0.07125rem; }
  .desc { margin: 4px 0 0; color: var(--text2); }
  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--text2); }
  .crumb button { background: none; border: 0; padding: 0; color: var(--text2); }
  .crumb button:hover { color: var(--primary); text-decoration: underline; }
  .crumb b { color: var(--text); font-weight: 400; }

  .card { background: var(--paper); border-radius: 8px; box-shadow: var(--card-shadow); }
  .card > .cc { padding: 24px; color: var(--text2); }
  h2 { margin: 0 0 6px; color: var(--text); font-size: 1.125rem; line-height: 1.5rem; font-weight: 400; letter-spacing: 0.025rem; }
  .caption { font-size: 12px; letter-spacing: 0.025rem; color: var(--text2); }
  .overline { font-size: 11px; line-height: 16px; letter-spacing: 0.09375rem; text-transform: uppercase; color: var(--text2); }
  .ink { color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 32px; padding: 0 12px; border-radius: 4px; border: 0;
    font-size: 13px; font-weight: 500; letter-spacing: 0.02857em; white-space: nowrap;
  }
  .btn.contained { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .btn.contained:hover { background: var(--primary-dark); }
  .btn.tonal { background: var(--surface); color: var(--primary); }
  .btn.tonal:hover { background: var(--selected); }
  .btn.outlined { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--divider); }
  .btn.outlined:hover { background: var(--hover); }
  .btn.text { background: transparent; color: var(--primary); padding: 0 8px; }
  .btn.text:hover { background: var(--hover); }
  .btn.large { height: 40px; padding: 0 20px; font-size: 14px; }
  .btn:disabled { background: var(--surface); color: var(--disabled); box-shadow: none; cursor: default; }
  .btn:disabled:hover { background: var(--surface); }
  .iconbtn { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--text2); display: grid; place-items: center; }
  .iconbtn:hover { background: var(--hover); }

  .chip {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px;
    font-size: 12px; letter-spacing: 0.025rem; white-space: nowrap;
  }
  .chip.info { background: hsla(210, 60%, 47%, 0.12); color: var(--primary-dark); }
  .chip.success { background: hsla(122, 50%, 35%, 0.15); color: var(--success); }
  .chip.warning { background: hsla(23, 80%, 45%, 0.15); color: var(--warning); }
  .chip.error { background: hsla(0, 65%, 51%, 0.15); color: var(--error); }
  .chip.neutral { background: hsla(240, 4%, 46%, 0.12); color: var(--text2); }
  .chip.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--divider); color: var(--text); }
  .pill {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.025rem; white-space: nowrap;
  }
  .pill.success { background: hsla(122, 50%, 35%, 0.15); color: var(--success); }
  .pill.warning { background: hsla(23, 80%, 45%, 0.15); color: var(--warning); }
  .pill.error { background: hsla(0, 65%, 51%, 0.15); color: var(--error); }
  .pill.neutral { background: hsla(240, 4%, 46%, 0.12); color: var(--text2); }
  .statusdot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
  .statusdot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  .alert {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--info); background: hsl(210, 100%, 97%); color: var(--text);
  }
  .alert svg { color: var(--info); margin-top: 1px; }

  .checkblock { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--divider); text-align: left; }
  .checkblock p { margin: 0 0 12px; color: var(--text); }
  .stage { max-width: 640px; margin: 64px auto 0; text-align: center; color: var(--text); }
  .stage .mark { display: flex; justify-content: center; margin-bottom: 12px; color: var(--disabled); }
  .stage .mark.error { color: var(--error); }
  .stage h2 { margin: 0 0 8px; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0; }
  .stage .body { margin: 0 auto; max-width: 520px; line-height: 22px; }
  .stage .progress { margin: 20px auto 0; max-width: 360px; }
  .stage .actions { justify-content: center; margin-top: 20px; }

  .codebox { display: flex; gap: 8px; align-items: stretch; }
  .code {
    flex: 1; min-width: 0; background: hsl(240, 4%, 13%); color: #fff; border-radius: 4px;
    padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; letter-spacing: 0; overflow-wrap: anywhere;
  }
  .code .addr { display: block; margin-top: 8px; color: #c7d2fe; word-break: break-all; }
  .copybtn { align-self: flex-start; height: 40px; }
  .sentence {
    background: var(--surface); border-radius: 4px; padding: 10px 12px; color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 0;
  }

  .progress { height: 4px; border-radius: 2px; background: hsl(210, 100%, 90%); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--primary); }

  /* My Agents table */
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .search {
    display: flex; align-items: center; gap: 8px; height: 32px; width: 320px; padding: 0 10px;
    border: 1px solid var(--divider); border-radius: 4px; color: var(--disabled);
  }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; font-size: 14px; color: var(--text); padding: 12px 16px; border-bottom: 1px solid var(--divider); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--divider); vertical-align: middle; color: var(--text); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--hover); }
  .agentlink { background: none; border: 0; padding: 0; font-weight: 500; color: var(--text); }
  tr.row:hover .agentlink { color: var(--primary); }

  /* Agent detail */
  .agenthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .agenthead .actions { flex-shrink: 0; margin-top: 4px; }
  .agenthead .titlerow { gap: 10px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 4px; margin-top: 16px; overflow-x: auto; }
  .tab {
    white-space: nowrap; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 12px;
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text); font-size: 14px;
  }
  .tab:hover { background: var(--hover); border-radius: 4px 4px 0 0; }
  .tab.on { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:not(.on) { cursor: default; }

  .scorecard { display: grid; grid-template-columns: 132px 1fr; gap: 24px; align-items: start; }
  .gauge { position: relative; width: 132px; height: 132px; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge b { font-size: 30px; line-height: 1; font-weight: 400; color: var(--text); letter-spacing: 0; }
  .gauge span { margin-top: 4px; font-size: 13px; color: var(--text2); }
  .chiprow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .facts { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .facts .v { color: var(--text); margin-top: 4px; }
  .facts .v.strong { font-weight: 500; }
  .dimrow {
    width: 100%; display: flex; align-items: center; gap: 16px; margin-top: 8px; padding: 12px 16px;
    background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; text-align: left; color: var(--text);
  }
  .dimrow:hover { background: var(--hover); }
  .dimrow .n { min-width: 220px; font-weight: 600; }
  .dimrow .bar { width: 120px; height: 6px; border-radius: 3px; background: hsl(210, 100%, 90%); overflow: hidden; }
  .dimrow .bar i { display: block; height: 100%; background: var(--primary); }
  .dimrow .s { min-width: 28px; }
  .dimrow .end { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--text2); font-size: 12px; }
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--text); font-size: 1.125rem; }
  .field + .field { margin-top: 16px; }
  .field .v { color: var(--text); margin-top: 4px; }

  /* Dialog */
  .backdrop { position: fixed; inset: 44px 0 0 0; background: rgba(0, 0, 0, 0.5); display: grid; place-items: center; z-index: 5; }
  .dialog { width: 600px; max-width: calc(100vw - 32px); background: var(--paper); border-radius: 10px; box-shadow: var(--dialog-shadow); }
  .dialog .dt { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 8px; }
  .dialog .dt h2 { margin: 0; font-size: 1.375rem; line-height: 1.75rem; letter-spacing: 0.02rem; }
  .dialog .dc { padding: 0 24px; color: var(--text); }
  .dialog .da { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; }
  .dialog .da .left { margin-right: auto; }
  .lead { margin: 0 0 16px; color: var(--text2); }
  .stepper { display: flex; gap: 6px; padding: 20px 24px 0; }
  .stepper i { width: 28px; height: 4px; border-radius: 2px; background: hsl(240, 5%, 90%); display: block; }
  .stepper i.on { background: var(--primary); }
  .welcomehero { display: flex; gap: 16px; align-items: center; padding: 8px 0 4px; }
  .welcomehero .mark { width: 48px; height: 48px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
  .welcomelist { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .welcomelist li { display: flex; gap: 12px; align-items: flex-start; color: var(--text); }
  .welcomelist .k {
    width: 24px; height: 24px; border-radius: 50%; background: var(--selected); color: var(--primary);
    display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .radiocards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .radiocard {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left;
    background: var(--paper); border: 1px solid var(--divider); border-radius: 8px; color: var(--text);
  }
  .radiocard .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text2); flex-shrink: 0; }
  .radiocard[aria-pressed="true"] { border-color: var(--primary); background: var(--selected); }
  .radiocard[aria-pressed="true"] .dot { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 8px var(--primary); }
  .label { display: block; font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .textfield { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--divider); border-radius: 4px; background: var(--paper); }
  .textfield:focus { outline: none; border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .helper { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.025rem; color: var(--text2); }

.mockbar { flex-wrap: wrap; position: sticky; top: 0; z-index: 30; align-items: center; }
#hint { flex-basis: 100%; color: #9aa0a6; white-space: normal; }
.barbit { display: none; align-items: center; gap: 8px; flex-basis: 100%; }
.barbit.on { display: flex; flex-wrap: wrap; }
.barbit span { color: #9aa0a6; }
.backdrop { inset: 0; z-index: 10; }
.dialog { width: 640px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.dialog.narrow { width: 480px; }
.dialog .dc { overflow: auto; }
.stage { max-width: 720px; margin: 0; text-align: left; }
.stage .body { margin: 0; max-width: 640px; }
.stage .progress { margin: 16px 0 0; max-width: 420px; }
.stage .mark { justify-content: flex-start; }
.instr ul, .trouble ul { margin: 8px 0 12px; padding-left: 18px; }
.instr ul li, .trouble ul li { margin: 0 0 8px; }
.tosca { font-size: 13px; color: var(--text2); }
.cc.plain { color: var(--text); }
.instr, .trouble, .substeps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.instr > li, .substeps > li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.instr h3, .trouble h3, .substeps h3 { margin: 2px 0 6px; font-size: 14px; font-weight: 600; letter-spacing: 0; color: var(--text); }
.instr p, .trouble p, .substeps p { margin: 0 0 8px; }
.k {
  width: 24px; height: 24px; border-radius: 50%; background: var(--selected); color: var(--primary);
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
}
.section { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--divider); }
details.section > summary {
  display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; color: var(--text);
}
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { margin: 0; }
details.section > summary svg { color: var(--text2); transition: transform 0.15s; }
details.section[open] > summary svg { transform: rotate(90deg); }
details.section[open] > summary { margin-bottom: 16px; }
.issues { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--divider); }
.issues > li { border-bottom: 1px solid var(--divider); }
details.issue > summary {
  display: flex; align-items: center; gap: 10px; padding: 12px 4px; cursor: pointer; list-style: none;
}
details.issue > summary::-webkit-details-marker { display: none; }
details.issue > summary:hover { background: var(--hover); }
details.issue > summary h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0; color: var(--text); }
details.issue > summary svg { color: var(--text2); transition: transform 0.15s; }
details.issue[open] > summary svg { transform: rotate(90deg); }
.issuebody { padding: 0 4px 14px 66px; }
.issuebody p { margin: 0 0 8px; }
.issuebody ul { margin: 8px 0 12px; padding-left: 18px; }
.issuebody ul li { margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: 148px 1fr; gap: 18px 20px; margin: 0; }
.kv dt { font-weight: 600; }
.kv dd { margin: 0; }
.kv dd .fine { margin: 6px 0 0; }
.fine { color: var(--text2); }
.trouble ul { margin: 8px 0 0; padding-left: 18px; }
.trouble li + li { margin-top: 0; }
code.inline {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px;
}
.code { white-space: pre-wrap; margin: 0; }
.stackcards { display: flex; flex-direction: column; gap: 8px; }
.stackcards .radiocard { width: 100%; }
.ann {
  display: inline-flex; align-items: center; height: 18px; margin-left: 8px; padding: 0 6px;
  border-radius: 999px; border: 1px dashed var(--primary); color: var(--primary-dark);
  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: middle;
}
.annrow { margin-bottom: 8px; }
.linkish { background: none; border: 0; padding: 0; color: var(--primary); text-align: left; font: inherit; }
.linkish:hover { text-decoration: underline; }
.pasteblock { margin-top: 20px; }
.pasteblock > p { margin: 0 0 8px; }
.dimrow.static { cursor: default; }
.dimrow.static:hover { background: var(--paper); }
.improve-score { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.improve-score b { font-size: 30px; font-weight: 400; letter-spacing: 0; line-height: 1; }
.improve-score .of { color: var(--text2); }
.banner {
  margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: var(--selected); color: var(--text);
}
.thread { display: flex; flex-direction: column; gap: 14px; max-width: 720px; }
.msg .who { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.msg .bubble { background: var(--surface); border-radius: 8px; padding: 12px 14px; }
.msg.you { align-self: flex-end; max-width: 480px; }
.msg.you .bubble { background: var(--selected); }
.msg .bubble p { margin: 0; white-space: pre-wrap; }
.revnote { margin: 6px 0 0; font-size: 12px; color: var(--text2); }
.revnote strong { font-weight: 600; }
.tab[aria-disabled="true"] { color: var(--disabled); cursor: default; }
.tab[aria-disabled="true"]:hover { background: none; }
.newctl { outline: 2px dashed var(--warning); outline-offset: 4px; }
.newblock { outline: 2px dashed var(--warning); outline-offset: 6px; border-radius: 4px; }
.improve-score.newblock { align-self: flex-start; margin: 6px; padding: 4px 8px; }
.improvehead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.runbox { margin-top: 16px; border: 1px solid var(--divider); border-radius: 4px; }
.runhead { display: flex; justify-content: space-between; align-items: center; padding: 12px; font-size: 12px; }
.rec { margin: 0 12px; padding: 12px 0; border-top: 1px solid var(--divider); }
.rechead { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; margin-bottom: 8px; }
.rec p { margin: 0 0 6px; max-width: 640px; line-height: 22px; }
.rec p:last-child { margin-bottom: 0; }
.tracestep { padding: 12px 14px; border: 1px solid var(--divider); border-radius: 4px; margin-top: 8px; }
.tracestep.flagged { border-color: var(--error); background: hsla(0, 65%, 51%, 0.04); }
.tracestep .who { display: flex; align-items: center; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.tracestep p { margin: 0; }
.choicehead { margin: 0 0 12px; font-size: 1.125rem; font-weight: 400; letter-spacing: 0.025rem; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>

function fresh() {
  return {
    screen: "home",
    wizard: null,
    popup: null,
    setup: false,
    client: "",
    mode: "agent",
    agentName: "",
    nameError: false,

const state = fresh();
let COPY = {};
let lastKey = "";

function clientById(id) {
  return CLIENTS.find((item) => item.id === id);
}
function agentName() {
  return state.agentName.trim();
}
function allowsAgent() {
  return Boolean(clientById(state.client)?.agent);
}
function effectiveMode() {
  return allowsAgent() ? state.mode : "self";
}
function esc(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function ensureName() {
  if (!agentName()) {
    state.agentName = "checkout-agent";
    state.previewName = true;
  }
}

function claudeAgentPrompt() {
  return `Add the Agent Score MCP server to Claude Code.
Run exactly: ${CLAUDE_ADD}
Use the URL as given, including everything after the ?. Do not add headers, tokens or an API key: it signs in through the browser.
When it is added, tell me to run /mcp, choose agent-score and pick Authenticate.`;
}
function cursorAgentPrompt() {
  return `Add the Agent Score MCP server to Cursor.
In .cursor/mcp.json, add this entry under "mcpServers", keeping any servers already there:
"agent-score": { "url": "${ADDRESS}" }
Use the URL as given, including everything after the ?. Do not add headers, tokens or an API key: it signs in through the browser.
Then tell me to open Customize, go to MCP, select agent-score and sign in.`;
}
function codexAgentPrompt() {
  return `Add the Agent Score MCP server to Codex.
In ~/.codex/config.toml, add this section, or replace an existing [mcp_servers.agent-score] section, keeping everything else:
[mcp_servers.agent-score]
url = "${ADDRESS}"
Use the URL as given, including everything after the ?. Do not add headers, tokens or an API key: it signs in through the browser.
The file is outside this project; ask me to approve the change if needed.
Then tell me to restart Codex and authenticate agent-score.`;
}
function setupPaste() {
  return `Set this agent up to send its traces to Agent Score. Name it ${agentName()}.`;
}
function purposePaste() {
  return `Use agent-score to tell me what ${agentName()} is for.`;
}
function improvePaste() {
  const name = agentName();
  return `Use agent-score to read the latest improvement advice for ${name}.
If that advice is still being generated, wait until it finishes, then read it.
Take the single highest-priority recommendation. If more than one is ranked high, take the first one listed.
Tell me in one or two plain sentences what it is and why it matters for ${name}.
Then propose that change in this project: show me the edit you would make, and wait for my go-ahead before you apply it.
Do not ask me to pick a recommendation, open a trace, or tell you the score.`;

function code(id, text) {
  COPY[id] = text;
  const copied = state.copied === id;
  return `<div class="codebox"><pre class="code">${esc(text)}</pre><button class="btn tonal copybtn" type="button" data-copy="${id}">${icon(copied ? "check" : "copy", 18)}${copied ? "Copied" : "Copy"}</button></div>`;
}
function inline(text) {
  return `<code class="inline">${esc(text)}</code>`;
}
function step(n, title, body) {
  return `<li><span class="k">${n}</span><div><h3>${title}</h3>${body}</div></li>`;
}
function pageHead(iconName, title) {
  return `<div class="band"><div class="pagehead"><div><div class="titlerow">${icon(iconName, 24)}<h1>${title}</h1></div></div></div></div>`;
}

function checkLine(who) {
  return `<p>Ask ${who}: ${inline("Use agent-score to check my agent connection.")} It answers with your ingest keys and whether traces arrived in the last hour.</p>`;
}

function agentInstructions() {
  const prompts = { claude: claudeAgentPrompt, cursor: cursorAgentPrompt, codex: codexAgentPrompt };
  const text = prompts[state.client]();
  return `
    <p>Copy and paste the below to your coding agent:</p>
    ${code("setup-prompt", text)}`;
}

    const add = {
      desktop: `<p>In the ChatGPT desktop app: <strong>Settings → MCP servers → Add server</strong>. Name ${inline("agent-score")}, choose <strong>Streamable HTTP</strong>, paste this URL, <strong>Save</strong>, then <strong>Restart</strong>.</p>${code("codex-desktop-url", ADDRESS)}`,
      ide: `<p>In the Codex panel of your editor: <strong>gear menu → MCP servers → Add server</strong>. Name ${inline("agent-score")}, choose <strong>Streamable HTTP</strong>, paste this URL, <strong>Save</strong>, then <strong>Restart extension</strong>.</p>${code("codex-ide-url", ADDRESS)}`,

      desktop: `<p>In <strong>Settings → MCP servers</strong>, click <strong>Authenticate</strong> beside agent-score and Allow the request in the browser.</p>`,
      ide: `<p>In <strong>MCP servers</strong>, click <strong>Authenticate</strong> beside agent-score and Allow the request in the browser.</p>`,
      cli: `${code("codex-cli-login", "codex mcp login agent-score")}<p>Allow the request in the browser, then start a new Codex session so it loads the server.</p>`,
    }[where];
    return `<ol class="instr">
      ${step("1", "Add the server", `
        <p>Where do you use Codex?</p>
        <p class="caption">They share one configuration, so adding it once covers all three.</p>

      ${step("2", "Sign in", signIn)}

        <p>Confirm agent-score is listed: type ${inline("/mcp")} in the ChatGPT desktop app or the CLI, or open <strong>MCP servers</strong> in the IDE extension. Then ask:</p>

    </ol>`;

  if (state.client === "desktop") {

          <p>Fill in the form with these values, then click Add:</p>
          <ul>

        ${step("3", "Check it works", `<p>In a chat, click + → Connectors and turn on Agent Score, then ask: ${inline("Use Agent Score to check my agent connection.")} It answers with your ingest keys and whether traces arrived in the last hour.</p>`)}

    <ol class="instr">

        <p>Enter these values:</p>
        <ul>
          <li>Server name: ${inline("agent-score")} (any name works)</li>

          <li>Transport: Streamable HTTP</li>
          <li>Sign-in: OAuth with dynamic client registration. The client finds the sign-in service from the URL.</li>
          <li>Headers, API key, token, client ID: none. A client that insists on a client ID cannot connect.</li>

  return `

        ${issue("1", "The client says it needs authentication, or shows 401", `<p>The server is added but you have not signed in yet, or the sign-in expired. Do the "Sign in" step for your client again. A sign-in lasts as long as your organization's Tosca Cloud session policy allows.</p>`)}
        ${issue("2", '"Start the sign-in again" or "This sign-in can\'t be finished"', `<p>A sign-in must finish in the browser tab that started it, within ten minutes, and works once. Start it again from your client and keep that tab open until you are back in the client.</p>`)}
        ${issue("3", 'The client reports "invalid redirect" or cannot register', `<p>The client uses a callback address Agent Score does not accept. The clients listed above are supported; another client must sign in through a localhost callback.</p>`)}
        ${issue("4", 'Claude says "Couldn\'t reach the MCP server"', `<p>The Claude apps connect from Anthropic's cloud, not from your computer. Check the Server URL is pasted whole. If it is, contact your Tricentis contact: the connection from Anthropic's network may be blocked.</p>`)}
        ${issue("5", "My agent can't see a tool", `<p>The group that holds it may be off, for you or for your organization. Check Manage permissions. A group you turn on shows up only after you reconnect your coding agent; a group you turn off applies at once.</p>`)}
        ${issue("6", "I want to disconnect a client", `
          <p>Signing out of Agent Score does not disconnect a client; each client holds its own sign-in.</p>
          <ul>
            <li>Claude Code: ${inline("claude mcp logout agent-score")}, or Clear authentication in ${inline("/mcp")}. Removing a project-wide server removes it for every teammate.</li>

function scoreBody() {
  const circ = 2 * Math.PI * 58;
  const dash = (circ * 0.66).toFixed(1);
  const rows = PARTS.map(([label, score, weight]) => `
    <div class="dimrow static">
      <span class="n">${label}</span>
      <span class="bar"><i style="width:${score}%"></i></span>
      <span class="s">${score}</span>
      <span class="end">Weight ${weight}</span>
    </div>`).join("");
  return `
    <div class="banner"><strong>Note.</strong> This page looks exactly the same as the current Score tab. The only change is the highlighted <strong>Improve</strong> button.</div>
    <div class="card"><div class="cc">
      <div class="scorecard">
        <div class="gauge" aria-hidden="true">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="58" fill="none" stroke="hsl(240,5%,92%)" stroke-width="12"/>
            <circle cx="66" cy="66" r="58" fill="none" stroke="hsl(23,80%,45%)" stroke-width="12"
              stroke-dasharray="${dash} ${circ.toFixed(1)}" stroke-linecap="butt"/>
          </svg>
          <div class="num"><b>66</b><span>/ 100</span></div>
        </div>
        <div>
          <div class="chiprow">
            <span class="pill warning">Needs work</span>
            <button class="btn contained newctl" type="button" data-improve>${icon("improve", 18)}Improve</button>
          </div>
          <p class="fine" style="margin-top:12px">66 out of 100. Needs work is 55 to 69.</p>
        </div>
      </div>
    </div></div>
    <div class="card"><div class="cc">
      <h2>Score breakdown</h2>

}

function profileBody() {
  const rows = EVALS.map(([label, threshold, weight]) => `
    <tr><td>${label}</td><td>${threshold}</td><td>${weight}</td></tr>`).join("");
  return `
    <div class="card" style="max-width:720px"><div class="cc plain">

      <h2>Tool Caller</h2>

      <h2 style="margin-top:20px">Evals</h2>

}

function improveBody() {

  return `
    <div class="banner"><strong>Note.</strong> This tab looks the same as the current Improve tab. The changes are highlighted: the score and verdict at the top, the generating message, and the paste box for the coding agent. Each recommendation is written in plain language, and its trace link opens that trace.</div>

function rankChip(rank) {
  return rank === "high" ? "error" : rank === "medium" ? "warning" : "neutral";
}

function tracesBody() {
  const trace = state.trace && TRACES[state.trace];
  if (!trace) {
    const rows = ADVICE.map((item) => `
      <tr class="row" data-open-trace="${item.trace}">
        <td><button class="linkish" type="button" data-open-trace="${item.trace}">${item.trace}</button></td>
        <td>${TRACES[item.trace].when}</td>
        <td>${esc(TRACES[item.trace].steps[0][1])}</td>
      </tr>`).join("");
    return `
      <div class="card"><table>
        <thead><tr><th>Trace</th><th>Started</th><th>First message</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }
  const cited = ADVICE.find((item) => item.trace === state.trace);
  const steps = trace.steps.map(([who, text, flagged]) => `
    <div class="tracestep${flagged ? " flagged" : ""}">
      <div class="who">${who}${flagged ? ` <span class="chip ${rankChip(cited.rank)}" style="margin-left:8px">Cited in advice</span>` : ""}</div>
      <p>${esc(text)}</p>
    </div>`).join("");
  const backLabel = state.traceFrom === "improve" ? "Back to Improve" : "All traces";
  return `
    <button class="back" type="button" data-trace-back>${icon("arrowBack", 20)}${backLabel}</button>
    <div class="card" style="margin-top:16px"><div class="cc plain">
      <div class="overline">Trace</div>
      <h2>${state.trace}</h2>
      <p class="caption" style="margin:0 0 16px">${trace.when}${cited ? ` · Cited by \u201c${cited.title}\u201d` : ""}</p>
      ${steps}
    </div></div>`;
}

function agentChrome(body) {
  const name = esc(agentName());

  const profileOn = state.phase === "enough" || scored;
  const tabs = [
    ["score", "speed", "Score", true],
    ["improve", "improve", "Improve", scored],
    ["card", "card", "Agent Card", false],
    ["traces", "list", "Traces", scored],
    ["profile", "tune", "Profile", profileOn],
    ["labeling", "label", "Labeling", false],
    ["settings", "settings", "Settings", false],
  ].map(([id, ic, label, enabled]) => {
    const on = state.tab === id;
    return `<button class="tab${on ? " on" : ""}" type="button" data-tab="${id}" ${enabled ? "" : 'aria-disabled="true"'}>${icon(ic, 16)}${label}</button>`;
  }).join("");
  return `
    <div class="band" style="padding-bottom:0">
      <div class="crumb"><button type="button" data-jump="agents">My Agents</button><span>/</span><b>${name}</b></div>

        <div>

function agentPage() {
  let body = waitingBody();
  if (state.tab === "improve") body = improveBody();
  else if (state.tab === "traces") body = tracesBody();
  else if (state.tab === "profile") body = profileBody();
  else if (state.phase === "scored") body = scoreBody();
  else if (state.phase === "enough") body = enoughBody();
  else if (state.phase === "partial") body = partialBody();
  return agentChrome(body);
}

function profileAnswer() {
  const lines = EVALS.map(([label, threshold, weight]) => `${label}. Threshold ${threshold}. Weight ${weight}.`).join("\n");
  return `Tool Caller. Agent Score chose this profile because the agent answers by using tools.\n\n${lines}`;
}

function bubble(who, html, note, you) {
  return `<div class="msg${you ? " you" : ""}"><div class="who">${who}</div><div class="bubble">${html}</div>${note ? `<p class="revnote"><strong>Reviewer note.</strong> ${note}</p>` : ""}</div>`;
}

function threadPage() {
  const name = esc(agentName());
  const blocks = [
    bubble("Coding agent", `<p>What should Agent Score call this agent?</p>`, "Instead of the naming popup. Calls check_agent_connection. Nothing is sending traces yet. Next action: type a name."),
  ];
  if (state.threadStep === 1) {
    blocks.push(`<div class="msg you"><div class="who">You</div><div class="bubble"><label class="label" for="thread-name">Name</label><input id="thread-name" class="textfield" value="${name}" autocomplete="off" /><div class="actions" style="margin-top:10px"><button class="btn contained" type="button" data-thread-name>Send</button></div></div></div>`);
  }
  if (state.threadStep >= 2) {
    blocks.push(bubble("You", `<p>${name}</p>`, "", true));
    blocks.push(bubble("Coding agent", `<p>${name} is set up. Nothing from ${name} yet. Restart ${name} if it was running, then use it the way you already do. A score needs about 20 real requests. A hello or a made-up request does not count.</p>`, "Instead of the paste box and the waiting page. It does what that paste asks, under this name. Next action: use the agent."));
  }
  if (state.threadStep >= 3) {
    blocks.push(bubble("Coding agent", `<p>12 of about 20 real requests to ${name}. Keep using it the way you already do. A hello or a made-up request does not count.</p>`, "Instead of the progress page. It keeps calling check_agent_connection and posts a new line whenever the count rises. Next action: keep using the agent. If the session ends first, ask how it is going. It picks up from here."));
  }
  if (state.threadStep >= 4) {
    blocks.push(bubble("Coding agent", `<p>Agent Score has enough to go on. It is analyzing ${name}, writing the evaluations, and then scoring it. I'll post the score here when it's ready.</p><p style="margin-top:8px">Want to see what evals were chosen and why? Ask me: "Show me what evals were chosen for ${name} and why."</p>`, "Instead of the enough popup. Next action, optional: ask that question. The answer comes from get_profile_fit, then it waits on get_scorecard."));
  }
  if (state.threadAsked) {
    blocks.push(bubble("You", `<p>Show me what evals were chosen for ${name} and why.</p>`, "", true));
    blocks.push(bubble("Coding agent", `<p>${esc(profileAnswer())}</p>`, "Then it goes back to waiting for the score."));
  }
  if (state.threadStep >= 5) {
    blocks.push(bubble("Coding agent", `<p>${name} scored 66 out of 100. Verdict: Needs work.</p><p style="margin-top:8px">Paste this here, or in a new session in this project, to get the top recommendation as a change to your project:</p><div style="margin-top:10px">${code("thread-improve", improvePaste())}</div>`, "Instead of the Score tab, the Improve button, and the Improve tab. request_improvement_advice stands in for the Improve click. Next action: paste it. The paste block is the step 12 block, word for word."));
  }
  return `
    ${pageHead("chat", "Coding agent")}
    <div class="content">
      <div class="banner">This thread replaces the web screens in steps 8–12. It is not an Agent Score page. A person on the web path gets these same updates, and either side can be closed. Steps 1–7 still happen in the web app. When the coding agent cannot sign in by itself, the person still clicks Allow in the browser.</div>
      <div class="thread">${blocks.join("")}</div>
      <div class="card" style="margin-top:8px"><div class="cc plain">
        <h2>Change to the MCP server's onboarding guidance</h2>
        <p>Today, step 6 of agent-score://docs/onboard-your-agent ends:</p>
        <p>${inline("The developer follows the agent's progress in the Agent Score app; nothing more is needed from you.")}</p>
        <p>Replace that sentence with:</p>
        ${code("mcp-guidance", `Do not stop here, and do not send the developer to the Agent Score app. Stay in this thread and follow the agent until it has a score.
Keep calling check_agent_connection with agent_name and wait_seconds 25. Each time traces.accepted rises, tell the developer how many of about 20 real requests have arrived, and to keep using the agent the way they already do.
At about 20, tell the developer Agent Score has enough to go on and is scoring the agent. If they ask what evals were chosen and why, answer from get_profile_fit.
Call get_scorecard until it shows a score and verdict. Report both, call request_improvement_advice for the latest scored run, and show the developer the improvement paste block below, word for word.
If this session ends first, pick up from the same point the next time the developer asks.`)}
        <p style="margin-top:12px">The resource then carries the step 12 paste block, word for word.</p>
        ${code("mcp-paste", improvePaste())}
        <p class="fine" style="margin-top:12px">The limit in step 5 of the resource, "Do not poll indefinitely", stays. It covers confirming setup when no trace is ever accepted, not following progress after setup works.</p>
      </div></div>
    </div>`;
}

    <div class="backdrop"><div class="dialog narrow" role="dialog" aria-modal="true" aria-labelledby="name-title">

        <label class="label" for="agent-name">What do you want to name your agent?</label>

function enoughDialog() {
  const name = esc(agentName());
  return `
    <div class="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="enough-title">
      <div class="dt"><h2 id="enough-title">Agent Score has enough to go on.</h2><button class="iconbtn" type="button" aria-label="Close" data-close-popup>${icon("close", 20)}</button></div>
      <div class="dc"><p>It will analyze ${name}, write the evaluations, and then score it. You can close this page. The score will be on ${name} in My Agents.</p></div>
      <div class="da"><button class="btn contained" type="button" data-close-popup>Close</button></div>
    </div></div>`;

function hint() {
  const named = state.previewName ? " Preview filled the name checkout-agent." : "";
  if (state.screen === "thread") return "MCP-only path. The thread replaces steps 8–12." + named;
  if (state.popup === "name") return "Step 8. The connection is in. Ask for a name, then open My Agents / that name.";
  if (state.wizard === "intro") return "Step 3. Connect on Integrations opens this popup.";
  if (state.wizard === "client") return "Step 4. Five clients. Claude desktop and Another client skip the next choice.";
  if (state.wizard === "mode") return "Step 5. Have the coding agent set it up, or set it up yourself.";
  if (state.screen === "home") return "Steps 1–2. Signed in with a Tosca Cloud account. Connect opens the Connect popup on Integrations.";
  if (state.screen === "integrations" && state.setup) return "Steps 6–7. Instructions, then connection details and troubleshooting. Connection detected opens the name popup.";
  if (state.screen === "integrations") return "Integrations for MCP. Connect opens the popup.";
  if (state.screen === "agents") return "My Agents. Open the agent to continue the session.";
  if (state.tab === "profile") return "Step 10. Profile tab: the profile Agent Score chose, why, and each eval with its threshold and weight. The names here are an example." + named;
  if (state.tab === "traces" && state.trace) return "Step 12. The trace a recommendation cites, opened from its View trace link. The cited step is marked." + named;
  if (state.tab === "traces") return "Traces tab. Each row opens that trace." + named;
  if (state.tab === "improve") return "Step 12. Score and verdict stay at the top. The paste is there while advice generates, and it is the only next action." + named;
  if (state.phase === "scored") return "Step 11. Score and verdict are in. Improve is the only new control on this tab." + named;
  if (state.phase === "enough") return "Step 10. Close the popup to use the evals link and the paste box. Scoring has not finished." + named;
  if (state.phase === "partial") return "Step 9. The first requests are in. The coding agent thread shows this same count." + named;
  if (state.phase === "waiting" && state.screen === "agent") return "Step 8. Paste the setup line. The page waits for real requests." + named;
  return "";
}

function viewKey() {
  return [state.screen, state.wizard, state.popup, state.phase, state.tab, state.client, state.mode, state.advice, state.threadStep, state.threadAsked, state.setup, state.agentName, state.trace].join("|");
}

function render() {
  COPY = {};
  const key = viewKey();
  const main = document.getElementById("main");
  const keep = key === lastKey;
  const top = keep ? main.scrollTop : 0;
  lastKey = key;
  const pages = { home: homePage, integrations: integrationsPage, agents: agentsPage, agent: agentPage, thread: threadPage };
  main.innerHTML = (pages[state.screen] || homePage)();
  main.scrollTop = top;
  const modal = document.getElementById("modal");
  modal.innerHTML = state.wizard ? wizardDialog() : state.popup === "name" ? nameDialog() : state.popup === "enough" ? enoughDialog() : "";
  const focus = modal.querySelector("#agent-name, #thread-name");
  if (focus && !keep) focus.focus();

  const jump = currentJump();
  document.querySelectorAll(".mockbar [data-jump]").forEach((el) => {
    el.setAttribute("aria-pressed", el.getAttribute("data-jump") === jump ? "true" : "false");
  });
  const clientbar = document.getElementById("clientbar");
  clientbar.classList.toggle("on", state.screen === "integrations" && state.setup && !state.wizard && !state.popup);
  clientbar.querySelectorAll("[data-client]").forEach((el) => {
    el.setAttribute("aria-pressed", el.getAttribute("data-client") === state.client ? "true" : "false");
  });
  clientbar.querySelectorAll("[data-mode]").forEach((el) => {
    const mode = el.getAttribute("data-mode");
    const allowed = allowsAgent() || mode === "self";
    el.disabled = !allowed;
    el.setAttribute("aria-pressed", effectiveMode() === mode ? "true" : "false");
  });
  const advicebar = document.getElementById("advicebar");
  advicebar.classList.toggle("on", state.screen === "agent" && state.phase === "scored" && !state.popup);
  advicebar.querySelectorAll("[data-advice]").forEach((el) => {
    el.setAttribute("aria-pressed", state.advice === el.getAttribute("data-advice") ? "true" : "false");
  });
  const threadbar = document.getElementById("threadbar");
  threadbar.classList.toggle("on", state.screen === "thread");
  const next = threadbar.querySelector('[data-thread="next"]');
  if (next) next.disabled = state.threadStep >= 5;
  const ask = document.getElementById("ask-evals");
  if (ask) ask.disabled = state.threadStep < 4 || state.threadAsked;
  document.getElementById("hint").textContent = hint();
  const railName = state.screen === "agent" || state.screen === "agents" ? "agents" : state.screen === "integrations" || state.wizard ? "integrations" : state.screen === "home" ? "home" : "";
  document.querySelectorAll(".rail [data-jump]").forEach((el) => {
    if (el.getAttribute("data-jump") === railName) el.setAttribute("aria-current", "page");
    else el.removeAttribute("aria-current");
  });
}

function currentJump() {
  if (state.popup === "name") return "detect";
  if (state.wizard) return "wizard";
  if (state.screen === "thread") return "thread";
  if (state.screen === "agent" && state.tab === "improve") return "improve";
  if (state.screen === "agent" && state.tab === "traces") return "";
  if (state.screen === "agent" && state.phase === "scored") return "score";
  if (state.screen === "agent" && state.phase === "enough") return "enough";
  if (state.screen === "agent" && state.phase === "partial") return "partial";
  if (state.screen === "agent" && state.phase === "waiting") return "waiting";
  if (state.screen === "integrations") return "integrations";
  if (state.screen === "home") return "home";
  return "";
}

function showInstructions() {
  if (!state.client) state.client = "claude";
  if (!allowsAgent()) state.mode = "self";
  state.setup = true;
  state.screen = "integrations";
  state.wizard = null;
  state.cursorOpened = false;
  state.copied = "";
}

function goAgent(phase, tab) {
  ensureName();
  state.screen = "agent";
  state.phase = phase;
  state.tab = tab || "score";
  state.wizard = null;
  if (phase !== "enough") state.popup = null;
}

function jump(to) {
  state.nameError = false;
  if (to === "start") {
    Object.assign(state, fresh());
    lastKey = "";
    render();
    return;
  }
  if (to === "home") {
    state.screen = "home";
    state.wizard = null;
    state.popup = null;
    render();
    return;
  }
  if (to === "integrations") {
    state.screen = "integrations";
    state.wizard = null;
    state.popup = null;
    render();
    return;
  }
  if (to === "agents") {
    state.screen = "agents";
    state.wizard = null;
    state.popup = null;
    render();
    return;
  }
  if (to === "wizard") {
    state.screen = "integrations";
    state.popup = null;
    state.wizard = "intro";
    render();
    return;
  }
  if (to === "detect") {
    showInstructions();
    state.popup = "name";
    render();
    return;
  }
  if (to === "thread") {
    ensureName();
    state.screen = "thread";
    state.wizard = null;
    state.popup = null;
    render();
    return;
  }
  if (to === "waiting") goAgent("waiting");
  if (to === "partial") goAgent("partial");
  if (to === "enough") {
    goAgent("enough");
    state.popup = "enough";
  }
  if (to === "score") goAgent("scored");
  if (to === "improve") {
    goAgent("scored", "improve");
    if (state.advice === "none") state.advice = "generating";
  }
  render();
}

function wizardNext() {
  if (state.wizard === "intro") {
    state.wizard = "client";
    render();
    return;
  }
  if (state.wizard === "client") {
    if (!state.client) return;
    if (!allowsAgent()) {
      state.mode = "self";
      state.setup = true;
      state.wizard = null;
      state.screen = "integrations";
    } else {
      state.wizard = "mode";
    }
    render();
  }
}

function finishMode(mode) {
  state.mode = mode;
  state.setup = true;
  state.wizard = null;
  state.screen = "integrations";
  state.copied = "";
  render();
}

function submitName() {
  const input = document.getElementById("agent-name");
  const value = input ? input.value.trim() : "";
  if (!value) {
    state.nameError = true;
    state.agentName = "";
    render();
    return;
  }
  state.agentName = value;
  state.previewName = false;
  state.nameError = false;
  state.popup = null;
  state.phase = "waiting";
  state.tab = "score";
  state.screen = "agent";
  render();
}

function submitThreadName() {
  const input = document.getElementById("thread-name");
  const value = input ? input.value.trim() : "";
  if (!value) return;
  state.agentName = value;
  state.previewName = false;
  state.threadStep = Math.max(state.threadStep, 2);
  render();
}

function openImprove() {
  if (state.phase !== "scored") return;
  if (state.advice === "none") state.advice = "generating";
  state.tab = "improve";
  state.popup = null;
  render();
}

document.querySelectorAll("[data-icon]").forEach((el) => {
  el.innerHTML = icon(el.getAttribute("data-icon"), Number(el.getAttribute("data-size") || 24));
});
document.getElementById("credits").innerHTML = `${icon("credits", 14)}AI credits: 1,000.000 / 1,000.000`;
document.getElementById("caret").innerHTML = icon("expand", 20);

document.body.addEventListener("click", (event) => {
  const el = event.target.closest("button, tr[data-open-agent], tr[data-open-trace]");
  if (!el) return;
  if (el.dataset.openTrace) {
    state.traceFrom = state.tab === "improve" ? "improve" : "traces";
    state.tab = "traces";
    state.trace = el.dataset.openTrace;
    render();
    return;
  }
  if (el.dataset.traceBack !== undefined || el.hasAttribute("data-trace-back")) {
    state.tab = state.traceFrom === "improve" ? "improve" : "traces";
    state.trace = null;
    state.traceFrom = "";
    render();
    return;
  }
  if (el.dataset.jump) return jump(el.dataset.jump);
  if (el.dataset.openWizard !== undefined || el.hasAttribute("data-open-wizard")) {
    state.screen = "integrations";
    state.popup = null;
    state.wizard = "intro";
    render();
    return;
  }
  if (el.dataset.wizardAt) {
    state.wizard = el.dataset.wizardAt;
    state.screen = "integrations";
    render();
    return;
  }
  if (el.dataset.wizardNext !== undefined || el.hasAttribute("data-wizard-next")) return wizardNext();
  if (el.dataset.pickClient) {
    state.client = el.dataset.pickClient;
    state.copied = "";
    render();
    return;
  }
  if (el.dataset.pickMode) return finishMode(el.dataset.pickMode);
  if (el.dataset.closeWizard !== undefined || el.hasAttribute("data-close-wizard")) {
    state.wizard = null;
    render();
    return;
  }
  if (el.dataset.closePopup !== undefined || el.hasAttribute("data-close-popup")) {
    state.popup = null;
    render();
    return;
  }
  if (el.dataset.submitName !== undefined || el.hasAttribute("data-submit-name")) return submitName();
  if (el.dataset.threadName !== undefined || el.hasAttribute("data-thread-name")) return submitThreadName();
  if (el.dataset.copy) {
    const text = COPY[el.dataset.copy] || "";
    if (navigator.clipboard && text) navigator.clipboard.writeText(text).catch(() => {});
    state.copied = el.dataset.copy;
    render();
    return;
  }
  if (el.dataset.client) {
    state.client = el.dataset.client;
    if (!allowsAgent()) state.mode = "self";
    state.cursorOpened = false;
    state.copied = "";
    render();
    return;
  }
  if (el.dataset.mode) {
    if (el.dataset.mode === "agent" && !allowsAgent()) return;
    state.mode = el.dataset.mode;
    state.copied = "";
    render();
    return;
  }
  if (el.dataset.codexWhere) {
    state.codexWhere = el.dataset.codexWhere;
    state.copied = "";
    render();
    return;
  }
  if (el.dataset.addCursor !== undefined || el.hasAttribute("data-add-cursor")) {
    state.cursorOpened = true;
    render();
    return;
  }
  if (el.dataset.openAgent !== undefined || el.hasAttribute("data-open-agent")) {
    if (!agentName()) return;
    state.screen = "agent";
    state.popup = null;
    render();
    return;
  }
  if (el.dataset.openProfile !== undefined || el.hasAttribute("data-open-profile")) {
    state.tab = "profile";
    state.popup = null;
    render();
    return;
  }
  if (el.dataset.improve !== undefined || el.hasAttribute("data-improve")) return openImprove();
  if (el.dataset.tab) {
    const tab = el.dataset.tab;
    if (el.getAttribute("aria-disabled") === "true") return;
    if (tab === "improve") return openImprove();
    if (tab === "traces") {
      state.tab = "traces";
      state.trace = null;
      state.traceFrom = "";
      render();
      return;
    }
    if (tab === "profile") {
      state.tab = "profile";
      state.popup = null;
      render();
      return;
    }
    if (tab === "score") {
      state.tab = "score";
      render();
    }
    return;
  }
  if (el.dataset.advice) {
    ensureName();
    state.screen = "agent";
    state.phase = "scored";
    state.tab = "improve";
    state.advice = el.dataset.advice;
    state.popup = null;
    render();
    return;
  }
  if (el.dataset.thread === "next") {
    ensureName();
    state.threadStep = Math.min(5, state.threadStep + 1);
    render();
    return;
  }
  if (el.dataset.thread === "ask") {
    if (state.threadStep < 4 || state.threadAsked) return;
    state.threadAsked = true;
    render();
    return;
  }
  if (el.dataset.thread === "reset") {
    state.threadStep = 1;
    state.threadAsked = false;
    state.screen = "thread";
    render();
  }
});

document.addEventListener("toggle", (event) => {
  const name = event.target.dataset?.section;
  if (name) state.open[name] = event.target.open;
}, true);

document.body.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && event.target.id === "agent-name") {
    event.preventDefault();
    submitName();
  }
  if (event.key === "Enter" && event.target.id === "thread-name") {
    event.preventDefault();
    submitThreadName();
  }
  if (event.key === "Escape") {
    if (state.popup) {
      state.popup = null;
      render();
    } else if (state.wizard) {
      state.wizard = null;
      render();
    }
  }
});

render();
</script>
</body>
</html>
