<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Score — first session mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --text: hsl(0, 0%, 0%);
    --text2: #52525b;
    --disabled: hsl(240, 5%, 65%);
    --divider: hsl(240, 5%, 84%);
    --paper: #fff;
    --surface: hsl(240, 5%, 96%);
    --hover: hsl(0, 0%, 98%);
    --selected: hsl(210, 100%, 95%);
    --primary: hsl(210, 60%, 47%);
    --primary-dark: hsl(210, 70%, 39%);
    --brand: #004c97;
    --success: hsl(122, 50%, 35%);
    --warning: hsl(23, 80%, 45%);
    --error: hsl(0, 65%, 51%);
    --info: hsl(210, 60%, 47%);
    --card-shadow: 0 2px 1px -1px rgba(0, 0, 0, 0.08), 0 1px 1px 0 rgba(0, 0, 0, 0.06), 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    --dialog-shadow: 0 11px 15px -7px rgba(0, 0, 0, 0.2), 0 24px 38px 3px rgba(0, 0, 0, 0.14), 0 9px 46px 8px rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px; line-height: 20px; letter-spacing: 0.03125rem;
    color: var(--text);
    background: #111418;
    display: flex; flex-direction: column;
  }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  svg.i { display: block; flex-shrink: 0; fill: currentColor; }

  /* Mock-only preview bar */
  .mockbar {
    min-height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; background: #111418; color: #c9cdd3; font-size: 12px;
    letter-spacing: 0; overflow-x: auto;
  }
  .mockbar span, .mockbar strong { white-space: nowrap; flex-shrink: 0; }
  .mockbar strong { color: #fff; font-weight: 600; }
  .mockbar .spacer { flex: 1; }
  .mockbar button {
    background: transparent; border: 1px solid #3a4048; color: #e8eaed;
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; flex-shrink: 0;
  }
  .mockbar button[aria-pressed="true"] { background: #fff; color: #111418; border-color: #fff; }
  #waitbar { display: flex; gap: 8px; margin-left: 8px; }

  /* App shell */
  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
  header.topbar {
    flex-shrink: 0; height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--divider);
  }
  .topbar img { height: 28px; width: auto; user-select: none; }
  .account { display: flex; align-items: center; gap: 8px; }
  .credits {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px;
    border: 1px solid var(--divider); border-radius: 4px; font-size: 12px; letter-spacing: 0.025rem;
  }
  .usermenu { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 4px; color: var(--text2); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: hsl(240, 4%, 26%); color: #fff;
    display: grid; place-items: center; font-size: 13px; font-weight: 500;
  }
  .shell { flex: 1; display: flex; min-height: 0; }
  .rail {
    width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
    padding: 8px; border-right: 1px solid var(--divider); background: var(--paper);
  }
  .panelswitch {
    width: 48px; display: flex; flex-direction: column; gap: 4px; padding: 4px;
    border: 1px solid var(--divider); border-radius: 4px; margin-bottom: 8px;
  }
  .panelswitch button {
    position: relative; width: 40px; height: 40px; border: 0; border-radius: 4px;
    background: transparent; color: var(--text2); display: grid; place-items: center;
  }
  .panelswitch button[aria-pressed="true"] { background: var(--selected); color: var(--primary); }
  .panelswitch button[aria-pressed="true"]::before {
    content: ""; position: absolute; top: 50%; left: -2px; width: 3px; height: 20px;
    border-radius: 2px; background: var(--primary); transform: translateY(-50%);
  }
  .railnav { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .railnav button, .railfoot button {
    width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent;
    color: var(--text2); display: grid; place-items: center;
  }
  .railnav button:hover, .railfoot button:hover { background: var(--hover); }
  .railnav button[aria-current="page"] { background: var(--selected); color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
  .railnav button:disabled { cursor: default; }

  main { flex: 1; min-width: 0; overflow: auto; background: var(--paper); }
  .band { padding: 32px 32px 20px; }
  .content { padding: 0 32px 32px; display: flex; flex-direction: column; gap: 24px; }
  .pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .titlerow { display: flex; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 1.375rem; line-height: 1.75rem; font-weight: 400; letter-spacing: 0.07125rem; }
  .desc { margin: 4px 0 0; color: var(--text2); }
  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--text2); }
  .crumb button { background: none; border: 0; padding: 0; color: var(--text2); }
  .crumb button:hover { color: var(--primary); text-decoration: underline; }
  .crumb b { color: var(--text); font-weight: 400; }

  .card { background: var(--paper); border-radius: 8px; box-shadow: var(--card-shadow); }
  .card > .cc { padding: 24px; color: var(--text2); }
  h2 { margin: 0 0 6px; color: var(--text); font-size: 1.125rem; line-height: 1.5rem; font-weight: 400; letter-spacing: 0.025rem; }
  .caption { font-size: 12px; letter-spacing: 0.025rem; color: var(--text2); }
  .overline { font-size: 11px; line-height: 16px; letter-spacing: 0.09375rem; text-transform: uppercase; color: var(--text2); }
  .ink { color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 32px; padding: 0 12px; border-radius: 4px; border: 0;
    font-size: 13px; font-weight: 500; letter-spacing: 0.02857em; white-space: nowrap;
  }
  .btn.contained { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .btn.contained:hover { background: var(--primary-dark); }
  .btn.tonal { background: var(--surface); color: var(--primary); }
  .btn.tonal:hover { background: var(--selected); }
  .btn.outlined { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--divider); }
  .btn.outlined:hover { background: var(--hover); }
  .btn.text { background: transparent; color: var(--primary); padding: 0 8px; }
  .btn.text:hover { background: var(--hover); }
  .btn.large { height: 40px; padding: 0 20px; font-size: 14px; }
  .btn:disabled { background: var(--surface); color: var(--disabled); box-shadow: none; cursor: default; }
  .btn:disabled:hover { background: var(--surface); }
  .iconbtn { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--text2); display: grid; place-items: center; }
  .iconbtn:hover { background: var(--hover); }

  .chip {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px;
    font-size: 12px; letter-spacing: 0.025rem; white-space: nowrap;
  }
  .chip.info { background: hsla(210, 60%, 47%, 0.12); color: var(--primary-dark); }
  .chip.success { background: hsla(122, 50%, 35%, 0.15); color: var(--success); }
  .chip.warning { background: hsla(23, 80%, 45%, 0.15); color: var(--warning); }
  .chip.error { background: hsla(0, 65%, 51%, 0.15); color: var(--error); }
  .chip.neutral { background: hsla(240, 4%, 46%, 0.12); color: var(--text2); }
  .chip.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--divider); color: var(--text); }
  .pill {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.025rem; white-space: nowrap;
  }
  .pill.success { background: hsla(122, 50%, 35%, 0.15); color: var(--success); }
  .pill.warning { background: hsla(23, 80%, 45%, 0.15); color: var(--warning); }
  .pill.error { background: hsla(0, 65%, 51%, 0.15); color: var(--error); }
  .pill.neutral { background: hsla(240, 4%, 46%, 0.12); color: var(--text2); }
  .statusdot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
  .statusdot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  .alert {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--info); background: hsl(210, 100%, 97%); color: var(--text);
  }
  .alert svg { color: var(--info); margin-top: 1px; }

  .checkblock { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--divider); text-align: left; }
  .checkblock p { margin: 0 0 12px; color: var(--text); }
  .stage { max-width: 640px; margin: 64px auto 0; text-align: center; color: var(--text); }
  .stage .mark { display: flex; justify-content: center; margin-bottom: 12px; color: var(--disabled); }
  .stage .mark.error { color: var(--error); }
  .stage h2 { margin: 0 0 8px; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0; }
  .stage .body { margin: 0 auto; max-width: 520px; line-height: 22px; }
  .stage .progress { margin: 20px auto 0; max-width: 360px; }
  .stage .actions { justify-content: center; margin-top: 20px; }

  .codebox { display: flex; gap: 8px; align-items: stretch; }
  .code {
    flex: 1; min-width: 0; background: hsl(240, 4%, 13%); color: #fff; border-radius: 4px;
    padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; letter-spacing: 0; overflow-wrap: anywhere;
  }
  .code .addr { display: block; margin-top: 8px; color: #c7d2fe; word-break: break-all; }
  .copybtn { align-self: flex-start; height: 40px; }
  .sentence {
    background: var(--surface); border-radius: 4px; padding: 10px 12px; color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 0;
  }

  .progress { height: 4px; border-radius: 2px; background: hsl(210, 100%, 90%); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--primary); }

  /* My Agents table */
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .search {
    display: flex; align-items: center; gap: 8px; height: 32px; width: 320px; padding: 0 10px;
    border: 1px solid var(--divider); border-radius: 4px; color: var(--disabled);
  }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; font-size: 14px; color: var(--text); padding: 12px 16px; border-bottom: 1px solid var(--divider); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--divider); vertical-align: middle; color: var(--text); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--hover); }
  .agentlink { background: none; border: 0; padding: 0; font-weight: 500; color: var(--text); }
  tr.row:hover .agentlink { color: var(--primary); }

  /* Agent detail */
  .agenthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .agenthead .actions { flex-shrink: 0; margin-top: 4px; }
  .agenthead .titlerow { gap: 10px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 4px; margin-top: 16px; overflow-x: auto; }
  .tab {
    white-space: nowrap; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 12px;
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text); font-size: 14px;
  }
  .tab:hover { background: var(--hover); border-radius: 4px 4px 0 0; }
  .tab.on { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:not(.on) { cursor: default; }

  .scorecard { display: grid; grid-template-columns: 132px 1fr; gap: 24px; align-items: start; }
  .gauge { position: relative; width: 132px; height: 132px; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge b { font-size: 30px; line-height: 1; font-weight: 400; color: var(--text); letter-spacing: 0; }
  .gauge span { margin-top: 4px; font-size: 13px; color: var(--text2); }
  .chiprow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .facts { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .facts .v { color: var(--text); margin-top: 4px; }
  .facts .v.strong { font-weight: 500; }
  .dimrow {
    width: 100%; display: flex; align-items: center; gap: 16px; margin-top: 8px; padding: 12px 16px;
    background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; text-align: left; color: var(--text);
  }
  .dimrow:hover { background: var(--hover); }
  .dimrow .n { min-width: 220px; font-weight: 600; }
  .dimrow .bar { width: 120px; height: 6px; border-radius: 3px; background: hsl(210, 100%, 90%); overflow: hidden; }
  .dimrow .bar i { display: block; height: 100%; background: var(--primary); }
  .dimrow .s { min-width: 28px; }
  .dimrow .end { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--text2); font-size: 12px; }
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--text); font-size: 1.125rem; }
  .field + .field { margin-top: 16px; }
  .field .v { color: var(--text); margin-top: 4px; }

  /* Dialog */
  .backdrop { position: fixed; inset: 44px 0 0 0; background: rgba(0, 0, 0, 0.5); display: grid; place-items: center; z-index: 5; }
  .dialog { width: 600px; max-width: calc(100vw - 32px); background: var(--paper); border-radius: 10px; box-shadow: var(--dialog-shadow); }
  .dialog .dt { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 8px; }
  .dialog .dt h2 { margin: 0; font-size: 1.375rem; line-height: 1.75rem; letter-spacing: 0.02rem; }
  .dialog .dc { padding: 0 24px; color: var(--text); }
  .dialog .da { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; }
  .dialog .da .left { margin-right: auto; }
  .lead { margin: 0 0 16px; color: var(--text2); }
  .stepper { display: flex; gap: 6px; padding: 20px 24px 0; }
  .stepper i { width: 28px; height: 4px; border-radius: 2px; background: hsl(240, 5%, 90%); display: block; }
  .stepper i.on { background: var(--primary); }
  .welcomehero { display: flex; gap: 16px; align-items: center; padding: 8px 0 4px; }
  .welcomehero .mark { width: 48px; height: 48px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
  .welcomelist { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .welcomelist li { display: flex; gap: 12px; align-items: flex-start; color: var(--text); }
  .welcomelist .k {
    width: 24px; height: 24px; border-radius: 50%; background: var(--selected); color: var(--primary);
    display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .radiocards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .radiocard {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left;
    background: var(--paper); border: 1px solid var(--divider); border-radius: 8px; color: var(--text);
  }
  .radiocard .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text2); flex-shrink: 0; }
  .radiocard[aria-pressed="true"] { border-color: var(--primary); background: var(--selected); }
  .radiocard[aria-pressed="true"] .dot { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 8px var(--primary); }
  .label { display: block; font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .textfield { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--divider); border-radius: 4px; background: var(--paper); }
  .textfield:focus { outline: none; border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .helper { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.025rem; color: var(--text2); }
</style>
</head>
<body>
  <div class="mockbar">
    <strong>Mock</strong>
    <span>Preview controls. Not in the product.</span>
    <span class="spacer"></span>
    <button type="button" data-first-login>First login</button>
    <button type="button" data-go="home">Home</button>
    <button type="button" data-open-guide>Connect</button>
    <button type="button" data-go="waiting">Waiting</button>
    <button type="button" data-go="agents">My Agents</button>
    <button type="button" data-go="score">Score</button>
    <span id="waitbar"></span>
    <span id="connectbar"></span>
  </div>
  <div class="app">
    <header class="topbar">
      <img alt="Agent Score" draggable="false" src="data:image/svg+xml;utf8,%3Csvg width='133' height='24' viewBox='0 0 133 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4C0 1.79086 1.79086 0 4 0H20C22.2091 0 24 1.79086 24 4V20C24 22.2091 22.2091 24 20 24H4C1.79086 24 0 22.2091 0 20V4Z' fill='%23004C97'/%3E%3Cpath d='M6.73495 16.6503L4.875 14.7908L7.67133 11.9951L4.89582 9.22033L6.75577 7.36084L11.3912 11.9951L6.73495 16.6503Z' fill='white'/%3E%3Cpath d='M9.59233 19.5063L7.73291 17.6468L12.3892 12.9917L17.0246 17.626L15.1647 19.485L12.3892 16.7107L9.59233 19.5063Z' fill='white'/%3E%3Cpath d='M12.3713 11.0146L7.73584 6.3803L9.59579 4.52135L12.3713 7.29617L15.1676 4.5L17.0276 6.35949L12.3713 11.0146Z' fill='white'/%3E%3Ctext x='28' y='18' fill='%23004C97' font-family='Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif' font-size='15.5' font-weight='600'%3EAgent Score%3C/text%3E%3C/svg%3E" />
      <div class="account">
        <span class="credits" id="credits"></span>
        <button class="usermenu" type="button" aria-label="Account"><span class="avatar">AD</span><span id="caret"></span></button>
      </div>
    </header>
    <div class="shell">
      <aside class="rail" aria-label="Primary">
        <div class="panelswitch" role="group" aria-label="Panel">
          <button type="button" aria-pressed="true" title="Workspace" data-icon="workspace" data-size="20"></button>
          <button type="button" aria-pressed="false" title="Assistant" data-icon="chat" data-size="20"></button>
        </div>
        <nav class="railnav">
          <button type="button" data-go="home" title="Home" aria-label="Home" data-icon="home"></button>
          <button type="button" data-go="agents" title="My Agents" aria-label="My Agents" data-icon="agents"></button>
          <button type="button" title="Evals" aria-label="Evals" data-icon="evals" disabled></button>
          <button type="button" title="Usage" aria-label="Usage" data-icon="usage" disabled></button>
          <button type="button" data-open-guide title="Integrations" aria-label="Integrations" data-icon="integrations"></button>
          <button type="button" title="Settings" aria-label="Settings" data-icon="settings" disabled></button>
          <button type="button" title="Docs" aria-label="Docs" data-icon="docs" disabled></button>
        </nav>
        <div class="railfoot"><button type="button" title="Open sidebar" aria-label="Open sidebar" data-icon="panelOpen" data-size="20"></button></div>
      </aside>
      <main id="main"></main>
    </div>
  </div>

const CLAUDE_COMMAND = `claude mcp add --transport http --scope local agent-score "${ADDRESS}"`;
const CLIENTS = [
  ["cursor", "Cursor"],
  ["claude", "Claude Code"],
  ["codex", "Codex"],
  ["apps", "Claude apps"],
];

const state = {
  screen: "home",
  client: "cursor",
  agentName: "checkout-agent",
  connectPhase: "wait",
  guide: "welcome",
  firstLogin: true,
  copied: false,
  verdictCopied: false,
  checkCopied: false,
  cardCopied: false,
  wait: "none",
  run: null,
};

function agentName() {
  return (state.agentName || "checkout-agent").trim();
}
function clientLabel() {
  return CLIENTS.find(([id]) => id === state.client)?.[1] || "Cursor";
}
function setupText() {
  return "Set this agent up to send its traces to Agent Score.";
}
function escapeHtml(value) {
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function openConnect() {
  state.screen = "connect";
  state.guide = null;
  state.firstLogin = false;
  state.connectPhase = "wait";
  state.copied = false;
  state.run = null;
  render();
}
function confirmText() {
  return `Use agent-score to check my agent connection for ${agentName()}.`;
}
function cardText() {
  return `Use agent-score to tell me what ${agentName()} is for.`;
}
function verdictText() {
  return `Tell me what ${agentName()} scored, what can be improved, and the next steps.`;
}

document.getElementById("caret").innerHTML = icon("expand", 20);

function go(screen) {
  state.screen = screen;
  state.run = null;
  state.guide = null;
  if (screen === "score") state.wait = "ready";
  render();
}

document.querySelectorAll(".mockbar [data-go], .rail [data-go]").forEach((el) => {
  el.addEventListener("click", () => go(el.getAttribute("data-go")));
});

document.body.addEventListener("click", (e) => {
  if (e.target.closest("[data-open-guide]")) openConnect();
  if (e.target.closest("[data-first-login]")) {
    state.screen = "home";
    state.firstLogin = true;
    state.guide = "welcome";
    state.wait = "none";
    state.copied = false;
    render();
  }
});

function render() {
  const current = state.screen === "score" || state.screen === "run" || state.screen === "waiting" ? "agents" : state.screen;
  document.querySelectorAll(".mockbar [data-go]").forEach((el) => {
    const on = el.getAttribute("data-go") === (state.screen === "run" ? "score" : state.screen);
    el.setAttribute("aria-pressed", on ? "true" : "false");
  });
  document.querySelectorAll(".rail [data-go]").forEach((el) => {
    if (el.getAttribute("data-go") === current) el.setAttribute("aria-current", "page");
    else el.removeAttribute("aria-current");
  });
  document.querySelectorAll(".mockbar [data-open-guide]").forEach((el) => {
    el.setAttribute("aria-pressed", state.screen === "connect" ? "true" : "false");
  });
  const integrations = document.querySelector(".rail [data-open-guide]");
  if (integrations) {
    if (state.screen === "connect") integrations.setAttribute("aria-current", "page");
    else integrations.removeAttribute("aria-current");
  }
  const main = document.getElementById("main");
  main.innerHTML = screens[state.screen]();
  bind(main);

  const waitbar = document.getElementById("waitbar");
  const showWait = state.screen === "waiting" || state.screen === "agents" || state.screen === "score";
  waitbar.innerHTML = showWait ? [
    ["none", "Nothing yet"],
    ["partial", "12 of about 20"],
    ["writing", "Writing the score"],
    ["unscored", "Can't be scored"],
    ["ready", "Verdict ready"],
  ].map(([id, label]) => `<button type="button" data-wait="${id}" aria-pressed="${state.wait === id}">${label}</button>`).join("") : "";
  waitbar.querySelectorAll("[data-wait]").forEach((el) => {
    el.addEventListener("click", () => {
      state.wait = el.getAttribute("data-wait");
      if (state.screen === "run") state.screen = "score";
      render();
    });
  });

  const connectbar = document.getElementById("connectbar");
  connectbar.innerHTML = state.screen === "connect" ? [
    ["wait", "Not connected"],
    ["connected", "Connected"],
  ].map(([id, label]) => `<button type="button" data-connect-phase="${id}" aria-pressed="${(id === "wait") === (state.connectPhase === "wait")}">${label}</button>`).join("") : "";
  connectbar.querySelectorAll("[data-connect-phase]").forEach((el) => {
    el.addEventListener("click", () => {
      const next = el.getAttribute("data-connect-phase");
      state.copied = false;
      state.connectPhase = next === "wait" ? "wait" : "paste";
      render();
    });
  });

  const modal = document.getElementById("modal");
  modal.innerHTML = state.guide ? guideDialog() : "";
  const next = modal.querySelector("[data-guide-next]");
  if (next) next.addEventListener("click", () => openConnect());
  modal.querySelectorAll("[data-guide-close]").forEach((el) => {
    el.addEventListener("click", () => { state.guide = null; state.firstLogin = false; render(); });
  });

}

function bind(root) {
  root.querySelectorAll("[data-go]").forEach((el) => {
    el.addEventListener("click", () => go(el.getAttribute("data-go")));
  });
  root.querySelectorAll("[data-run]").forEach((el) => {
    el.addEventListener("click", () => { state.screen = "run"; state.run = el.getAttribute("data-run"); render(); });
  });
  root.querySelectorAll("[data-open-agent]").forEach((el) => {
    el.addEventListener("click", () => { state.screen = "score"; render(); });
  });
  const verdictCopy = root.querySelector("[data-copy-verdict]");
  if (verdictCopy) verdictCopy.addEventListener("click", () => { state.verdictCopied = true; render(); });
  const checkCopy = root.querySelector("[data-copy-check]");
  if (checkCopy) checkCopy.addEventListener("click", () => { state.checkCopied = true; render(); });
  const cardCopy = root.querySelector("[data-copy-card]");
  if (cardCopy) cardCopy.addEventListener("click", () => { state.cardCopied = true; render(); });
  root.querySelectorAll("[data-pick]").forEach((el) => {
    el.addEventListener("click", () => {
      state.client = el.getAttribute("data-pick");
      state.copied = false;
      render();
    });
  });
  const connectBack = root.querySelector("[data-connect-back]");
  if (connectBack) connectBack.addEventListener("click", () => {
    state.connectPhase = "wait";
    state.copied = false;
    render();
  });
  const pasted = root.querySelector("[data-pasted]");
  if (pasted) pasted.addEventListener("click", () => {
    state.screen = "waiting";
    state.wait = "none";
    render();
  });
  const copy = root.querySelector("[data-copy]");
  if (copy) copy.addEventListener("click", () => { state.copied = true; render(); });
}

function pageHead(title, desc, actions = "") {
  return `
    <div class="band">
      <div class="pagehead">
        <div>
          <div class="titlerow">${icon("workspace", 24)}<h1>${title}</h1></div>
          ${desc ? `<p class="desc">${desc}</p>` : ""}
        </div>
        ${actions ? `<div class="actions">${actions}</div>` : ""}
      </div>
    </div>`;
}

function stagePanel() {
  const name = agentName();
  const w = waits[state.wait];
  let title = "Waiting for real requests";
  let body = `Nothing from ${name} yet. Restart ${name} if it was running, then use it the way you already do. A score needs about 20 real requests to ${name}. A hello or a made-up request does not count. You can close this page; the score will be on ${name} in My Agents.`;
  let action = "";
  if (state.wait === "partial") {
    title = "Request received. Keep using your agent.";
    body = `12 of about 20 real requests to ${name}. Keep using it the way you already do. A hello or a made-up request does not count. You can close this page; the score will be on ${name} in My Agents.`;
  } else if (state.wait === "writing") {
    title = "Agent Score has enough to go on.";
    body = `It will analyze ${name}, write the evaluations, and then score it. You can close this page. The score will be on ${name} in My Agents.`;
  } else if (state.wait === "unscored") {
    body = `Something arrived from ${name}, and none of it can be scored. A hello or a made-up request does not count. Use it on a real request.`;
  } else if (state.wait === "ready") {
    title = "The score is ready";
    body = `${name} scored 82. Ship with note: it can ship, but read the lowest part of the score first.`;
    action = `
      <p class="ink" style="margin:20px 0 8px;text-align:left">Paste this into ${clientLabel()}.</p>
      <div class="codebox">
        <div class="code"><div>${verdictText()}</div></div>
        <button class="btn tonal copybtn" type="button" data-copy-verdict>${icon(state.verdictCopied ? "check" : "copy", 18)}${state.verdictCopied ? "Copied" : "Copy"}</button>
      </div>
      <div class="actions"><button class="btn contained" data-go="score">Read the score</button></div>`;
  }
  const showProgress = state.wait === "partial" || state.wait === "writing";
  const progress = showProgress
    ? `<div class="progress"><i style="width:${Math.min(100, (w.count / 20) * 100)}%"></i></div><div class="caption" style="margin-top:6px">${Math.min(w.count, 20)} of about 20 real requests</div>`
    : "";
  const check = state.wait === "none" ? `
    <div class="checkblock">
      <p>Want to check that you are connected to Agent Score? Run this in your coding agent:</p>
      <div class="codebox">
        <div class="code"><div>${confirmText()}</div></div>
        <button class="btn tonal copybtn" type="button" data-copy-check>${icon(state.checkCopied ? "check" : "copy", 18)}${state.checkCopied ? "Copied" : "Copy"}</button>
      </div>
    </div>` : "";
  const card = state.wait === "writing" ? `
    <div class="checkblock">
      <p>Want to know what Agent Score thinks this agent is for? Paste this into your coding agent:</p>
      <div class="codebox">
        <div class="code"><div>${cardText()}</div></div>
        <button class="btn tonal copybtn" type="button" data-copy-card>${icon(state.cardCopied ? "check" : "copy", 18)}${state.cardCopied ? "Copied" : "Copy"}</button>
      </div>
    </div>` : "";
  const mark = state.wait === "ready" ? "" : `<div class="mark${state.wait === "unscored" ? " error" : ""}">${hourglass()}</div>`;
  return `
    <div class="stage">
      ${mark}
      <h2>${title}</h2>
      <p class="body">${body}</p>
      ${progress}
      ${action}
      ${check}
      ${card}
    </div>`;
}

function connectWait() {
  const claude = state.client === "claude";
  const command = claude
    ? `<div class="code"><div>${escapeHtml(CLAUDE_COMMAND)}</div></div>`
    : `<div class="code"><span class="addr" style="margin-top:0">${escapeHtml(ADDRESS)}</span></div>`;
  const help = {
    cursor: "In Cursor, open Customize, go to MCP, and sign in on agent-score. Use the URL as given, including everything after the ?. Do not add headers, tokens, or an API key. It signs in through the browser.",
    codex: "In Codex, click Authenticate beside agent-score, then start a new session. Use the URL as given, including everything after the ?. Do not add headers, tokens, or an API key. It signs in through the browser.",
    apps: "In the Claude apps, add a custom connector named Agent Score and leave the OAuth client ID and secret empty. Then click Connect. Do not add a token or an API key. It signs in through the browser.",
  };
  const after = claude
    ? `<p class="helper" style="margin-top:12px;font-size:14px;color:var(--text)">Run this from the project folder. Use the URL as given, including everything after the ?. Do not add headers, tokens, or an API key. It signs in through the browser.</p>
       <p class="helper" style="margin-top:8px;font-size:14px;color:var(--text)">When it is added, run <code>/mcp</code>, choose agent-score, and pick Authenticate.</p>`
    : `<p class="helper" style="margin-top:12px;font-size:14px;color:var(--text)">${help[state.client] || help.cursor}</p>`;
  return `
    <div class="titlerow" style="align-items:flex-start">
      <span style="color:var(--disabled)">${hourglass()}</span>
      <div>
        <h2 style="margin:0 0 4px">Waiting for your coding agent to connect</h2>
        <p style="margin:0">Add Agent Score, then sign in through the browser. This page continues when the connection arrives.</p>
      </div>
    </div>
    <p class="label" style="margin-top:20px">Which coding agent are you using?</p>
    <div class="radiocards">
      ${CLIENTS.map(([id, label]) => `<button type="button" class="radiocard" data-pick="${id}" aria-pressed="${state.client === id}"><span class="dot"></span>${label}</button>`).join("")}
    </div>
    <div class="codebox" style="margin-top:16px">
      ${command}
      <button class="btn tonal copybtn" type="button" data-copy>${icon(state.copied ? "check" : "copy", 18)}${state.copied ? "Copied" : "Copy"}</button>
    </div>
    ${after}`;
}

function connectPaste() {
  return `
    <span class="chip success">Connected</span>
    <h2 style="margin-top:16px">Paste this into ${clientLabel()}.</h2>
    <p style="margin:0 0 16px">Paste it as written.</p>
    <div class="codebox">
      <div class="code"><div>${escapeHtml(setupText())}</div></div>
      <button class="btn tonal copybtn" type="button" data-copy>${icon(state.copied ? "check" : "copy", 18)}${state.copied ? "Copied" : "Copy"}</button>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn text" type="button" data-connect-back>Back</button>
      <button class="btn contained" type="button" data-pasted>I've pasted it</button>
    </div>`;
}

const screens = {
  connect() {
    const body = state.connectPhase === "wait" ? connectWait() : connectPaste();
    const desc = state.connectPhase === "wait"
      ? "This page continues when your coding agent connects."
      : `${clientLabel()} is connected.`;
    return `
      ${pageHead("Connect", desc)}
      <div class="content">
        <div class="card" style="max-width:720px"><div class="cc">${body}</div></div>
      </div>`;
  },
  home() {
    return `
      ${pageHead("Home", "Your real-agent health, scoring activity, and next steps in one place.")}
      <div class="content">
        <div class="card" style="max-width:720px">
          <div class="cc">
            <span class="chip info">Next step</span>
            <h2 style="margin-top:16px">Connect the coding agent you already use</h2>
            <p style="margin:0 0 16px">Agent Score scores an agent you already run and tells you whether it can ship. Your coding agent does the setup.</p>
            <button class="btn contained" data-open-guide>Connect</button>
          </div>
        </div>
      </div>`;
  },
  waiting() {
    return agentChrome(stagePanel());
  },
  agents() {
    const w = waits[state.wait];
    const ready = state.wait === "ready";
    return `
      ${pageHead("My Agents", "Every agent you have connected.")}
      <div class="content">
        <div class="toolbar"><div class="search">${icon("search", 18)}Search agents…</div></div>
        <div class="card">
          <table>
            <thead><tr><th style="width:24%">Agent</th><th>Tenant</th><th>Hosting</th><th>Status</th><th style="width:28%">Traces</th><th>Last active</th><th>Score</th></tr></thead>
            <tbody>
              <tr class="row" data-open-agent>
                <td><button class="agentlink" type="button">${agentName()}</button></td>
                <td>tais</td>
                <td><span class="chip outline">External</span></td>
                <td><span class="statusdot">Active</span></td>
                <td>${ready ? `${w.count}` : `<span class="chip ${w.tint}">${w.chipText}</span><div class="caption" style="margin-top:4px">${w.sentence}</div>`}</td>
                <td>Just now</td>
                <td>${ready ? `<span style="display:inline-flex;gap:8px;align-items:center"><span>82</span><span class="pill success">Ship with note</span></span>` : "—"}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>`;
  },
  score() {
    if (state.wait !== "ready") return agentChrome(stagePanel());
    const parts = [
      ["Got the order right", 91],
      ["Used the tools it needed", 74],
      ["Stayed inside the refund rule", 68],
    ].map(([name, n]) => `
      <button class="dimrow" data-run="${name}" type="button">
        <span class="n">${name}</span>
        <span class="bar"><i style="width:${n}%"></i></span>
        <span class="s">${n}</span>
        <span class="end">Open the run ${icon("chevronRight", 18)}</span>
      </button>`).join("");
    return agentChrome(`
      <div class="card"><div class="cc">
        <div class="scorecard">
          <div class="gauge">
            <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
              <circle cx="66" cy="66" r="58" fill="none" stroke="hsl(240,5%,92%)" stroke-width="12"/>
              <circle cx="66" cy="66" r="58" fill="none" stroke="hsl(122,50%,35%)" stroke-width="12"
                stroke-dasharray="${(2 * Math.PI * 58 * 0.82).toFixed(1)} ${(2 * Math.PI * 58).toFixed(1)}"/>
            </svg>
            <div class="num"><b>82</b><span>/ 100</span></div>
          </div>
          <div>
            <div class="chiprow"><span class="pill success">Ship with note</span><span class="chip outline">Scored on all 24 requests</span></div>
            <p style="margin:8px 0 0">Ship is 85 to 100. Ship with note is 70 to 84. Needs work is 55 to 69. Don't ship recommended is 40 to 54. Don't ship is 0 to 39.</p>
            <p style="margin:4px 0 0">Scored just now</p>
            <div class="facts">
              <div>
                <div class="overline">What this agent is for</div>
                <div class="v">Answers a customer about an order, looks the order up, and uses the payment and shipping tools to say what happens next.</div>
                <div class="caption" style="margin-top:4px">Agent Score wrote this from the agent's real requests.</div>
              </div>
              <div>
                <div class="overline">Judged as</div>
                <div class="v strong">An agent that answers by using tools.</div>
                <div class="caption" style="margin-top:4px">Tool Caller. Agent Score chose this from what the agent did.</div>
              </div>
            </div>
          </div>
        </div>
      </div></div>
      <div class="card"><div class="cc">
        <h2>Three parts of the 82</h2>
        <p class="caption" style="margin:0">Open one to see the request behind it.</p>
        ${parts}
      </div></div>`);
  },
  run() {
    const run = runs[state.run] || runs["Stayed inside the refund rule"];
    return agentChrome(`
      <div>
        <button class="back" data-go="score" type="button">${icon("arrowBack", 20)}${state.run}</button>
        <div class="caption" style="margin-top:4px">This number is ${run.score}</div>
      </div>
      <div class="card" style="max-width:760px"><div class="cc">
        <div class="field"><div class="overline">Asked</div><div class="v">${run.asked}</div></div>
        <div class="field"><div class="overline">Did</div><div class="v">${run.did}</div></div>
        <div class="field"><div class="overline">Answered</div><div class="v">${run.answered}</div></div>
        <p class="caption" style="margin:16px 0 0">${run.why}</p>
      </div></div>`);
  },
};

function agentChrome(body) {
  const scored = state.wait === "ready" || state.screen === "run";
  const chip = scored
    ? `<span class="chip success">Scored</span>`
    : `<span class="chip ${waits[state.wait].tint}">${waits[state.wait].chipText}</span>`;
  const tabs = [
    ["speed", "Score", true],
    ["improve", "Improve"],
    ["card", "Agent Card"],
    ["list", "Traces"],
    ["tune", "Profile"],
    ["label", "Labeling"],
    ["settings", "Settings"],
  ].map(([ic, label, on]) => `<button class="tab${on ? " on" : ""}" type="button">${icon(ic, 16)}${label}</button>`).join("");
  return `
    <div class="band" style="padding-bottom:0">
      <div class="crumb"><button type="button" data-go="agents">My Agents</button><span>/</span><b>${agentName()}</b></div>
      <div class="agenthead">
        <div>
          <div class="titlerow"><h1>${agentName()}</h1><span class="statusdot">Active</span>${chip}</div>
          <div class="caption" style="margin-top:4px">tais &nbsp;·&nbsp; external</div>
        </div>
        <div class="actions">
          <button class="btn text" type="button">Ask the assistant</button>
          <button class="iconbtn" type="button" aria-label="Refresh">${icon("sync", 20)}</button>
          <button class="btn ${scored ? "contained" : ""}" type="button" ${scored ? "" : "disabled"}>${icon("play", 18)}Score now</button>
        </div>
      </div>
      <div class="tabs">${tabs}</div>
    </div>
    <div class="content" style="padding-top:20px">${body}</div>`;
}

function guideDialog() {
  if (state.guide === "welcome") {
    return `
      <div class="backdrop">
        <div class="dialog" role="dialog" aria-modal="true" aria-label="Welcome to Agent Score" style="width:560px">
          <div class="dt">
            <h2>Welcome to Agent Score</h2>
            <button class="iconbtn" type="button" aria-label="Close" data-guide-close>${icon("close", 20)}</button>
          </div>
          <div class="dc">
            <p class="lead" style="margin-bottom:0">Agent Score scores an agent you already run and tells you whether it can ship. Your coding agent does the setup.</p>
            <ol class="welcomelist">
              <li><span class="k">1</span><span>Connect the coding agent you already use.</span></li>
              <li><span class="k">2</span><span>Use the agent you already run, the way you already do.</span></li>
              <li><span class="k">3</span><span>Come back to read its score and verdict.</span></li>
            </ol>
          </div>
          <div class="da">
            <button class="btn contained large" type="button" data-guide-next>Connect</button>
          </div>
        </div>
      </div>`;
  }
  return "";
}

render();
</script>
</body>
</html>
