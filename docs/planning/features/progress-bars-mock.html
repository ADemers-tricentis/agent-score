<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentScore progress bars - mock (AI-15178)</title>
<style>
  :root {
    --bg:#f3f5f9; --card:#ffffff; --text:#0f1b2d; --muted:#667489; --line:#e3e8ef;
    --blue:#2f6bff; --blue2:#6d8dff; --green:#12a150; --green2:#43c882;
    --red:#e5484d; --red2:#f27a7e; --amber:#e08a00; --amber2:#f6b84a;
    --track:#e9edf4; --shadow:0 1px 2px rgba(15,27,45,.05), 0 8px 24px rgba(15,27,45,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  /* app shell */
  .shell { display:grid; grid-template-columns:200px 1fr; min-height:100vh; }
  .side { background:#0f1b2d; color:#c8d2e2; padding:20px 14px; }
  .logo { color:#fff; font-weight:700; font-size:16px; padding:0 10px 18px; display:flex; align-items:center; gap:8px; }
  .logo i { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--blue),#8b5cf6); display:inline-block; }
  .nav { padding:8px 10px; border-radius:8px; margin-bottom:2px; font-size:13px; }
  .nav.on { background:rgba(255,255,255,.1); color:#fff; }
  .main { padding:28px 36px 48px; }
  .crumb { color:var(--muted); font-size:12px; margin-bottom:4px; }
  h1 { font-size:22px; margin:0 0 20px; letter-spacing:-.01em; }

  /* controls */
  .ctl { display:flex; flex-wrap:wrap; gap:14px 28px; align-items:center; margin-bottom:22px; }
  .seg { display:inline-flex; background:#e6ebf3; border-radius:10px; padding:3px; }
  .seg button { border:0; background:transparent; padding:7px 14px; border-radius:8px; cursor:pointer; font:inherit; color:var(--muted); font-weight:500; }
  .seg button.on { background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(15,27,45,.12); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:#fff; padding:5px 11px; border-radius:999px; cursor:pointer; font:inherit; font-size:12px; color:var(--muted); }
  .chip.on { border-color:var(--blue); color:var(--blue); background:#eef3ff; font-weight:600; }
  .play { border:0; background:var(--text); color:#fff; padding:7px 14px; border-radius:8px; cursor:pointer; font:inherit; font-size:12px; font-weight:600; }

  /* card */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 24px; max-width:680px; box-shadow:var(--shadow); }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .ico { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none; }
  .ico svg { width:20px; height:20px; }
  .ico.running { background:#e8efff; color:var(--blue); }
  .ico.stalled { background:#fff3dc; color:var(--amber); }
  .ico.failed { background:#ffe8e9; color:var(--red); }
  .ico.done { background:#e0f6ea; color:var(--green); }
  .ico.running svg { animation:spin 1.1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ttl { font-weight:650; font-size:16px; letter-spacing:-.005em; }
  .sub { color:var(--muted); font-size:12.5px; }
  .grow { flex:1; }
  .badge { font-size:12px; padding:4px 11px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .badge.running { background:#e8efff; color:var(--blue); }
  .badge.stalled { background:#fff3dc; color:#a96500; }
  .badge.failed { background:#ffe8e9; color:#c0282d; }
  .badge.done { background:#e0f6ea; color:#0c7a3b; }

  /* bar */
  .track { height:12px; background:var(--track); border-radius:999px; overflow:hidden; position:relative; }
  .fill { height:100%; border-radius:999px; position:relative; overflow:hidden; transition:width .5s cubic-bezier(.2,.7,.2,1);
          background:linear-gradient(90deg,var(--blue),var(--blue2)); }
  .fill.stalled { background:linear-gradient(90deg,var(--amber),var(--amber2)); }
  .fill.failed { background:linear-gradient(90deg,var(--red),var(--red2)); }
  .fill.done { background:linear-gradient(90deg,var(--green),var(--green2)); }
  .fill.running::after { content:""; position:absolute; inset:0;
      background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
      transform:translateX(-100%); animation:shimmer 1.6s infinite; }
  @keyframes shimmer { to { transform:translateX(100%); } }
  .fill.indet { position:absolute; width:35% !important; animation:slide 1.3s infinite ease-in-out; }
  @keyframes slide { from { left:-35%; } to { left:100%; } }
  .stat { display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; }
  .count { color:var(--muted); font-size:13px; }
  .pct { font-size:22px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

  /* stepper */
  .stepper { display:flex; margin:20px 0 4px; }
  .st { flex:1; position:relative; text-align:center; font-size:12px; color:var(--muted); }
  .st .dot { width:22px; height:22px; border-radius:50%; margin:0 auto 6px; display:grid; place-items:center;
             background:#fff; border:2px solid var(--line); font-size:11px; font-weight:700; position:relative; z-index:1; }
  .st::before { content:""; position:absolute; top:10px; left:-50%; width:100%; height:2px; background:var(--line); }
  .st:first-child::before { display:none; }
  .st.done .dot { background:var(--green); border-color:var(--green); color:#fff; }
  .st.done::before, .st.now::before { background:var(--green); }
  .st.now .dot { border-color:var(--blue); color:var(--blue); box-shadow:0 0 0 4px #e8efff; }
  .st.now { color:var(--text); font-weight:600; }
  .st.failed .dot { border-color:var(--red); color:var(--red); box-shadow:0 0 0 4px #ffe8e9; }
  .st.stalled .dot { border-color:var(--amber); color:var(--amber); box-shadow:0 0 0 4px #fff3dc; }

  /* note + actions */
  .note { margin-top:16px; padding:11px 14px; border-radius:10px; background:#f6f8fb; color:#34445c; font-size:13px; }
  .note.err { background:#fff1f1; color:#a32226; }
  .note.warn { background:#fff8ea; color:#8a5600; }
  .actions { margin-top:16px; display:flex; gap:8px; }
  .btn { border:1px solid var(--line); background:#fff; padding:8px 15px; border-radius:9px; cursor:pointer; font:inherit; font-weight:600; font-size:13px; color:var(--text); }
  .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.danger { color:var(--red); }
  .foot { color:var(--muted); font-size:12px; margin-top:18px; max-width:680px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo"><i></i>AgentScore</div>
    <div class="nav">Agents</div>
    <div class="nav on">Runs</div>
    <div class="nav">Scorecards</div>
    <div class="nav">Settings</div>
  </aside>
  <main class="main">
    <div class="crumb">Agents / Support Triage Agent / Runs</div>
    <h1>Run progress <span class="sub" style="font-weight:400">mock for AI-15178</span></h1>

    <div class="ctl">
      <div class="seg" id="tabs"></div>
      <div class="chips" id="states"></div>
      <button class="play" id="play" onclick="playDemo()">&#9654; Play demo</button>
    </div>

    <div id="out"></div>
    <div class="foot">Every card renders from backend fields (completed, total, stage, status), so a page reload shows the same state. Stalled appears after a set time with no update. Not wired to real data.</div>
  </main>
</div>

<script>
const ICON = {
  running: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" /></svg>',
  stalled: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  failed:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  done:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>'
};
const stages = {
  ingestion: { label:"Ingestion", title:"Ingesting traces", sub:"Source: production traces", steps:null, total:400, unit:"traces",
    states:{
      running:{ kind:"running", badge:"Running", pct:30, count:"120 / 400 traces" },
      indeterminate:{ kind:"running", badge:"Running", indet:true, count:"Counting traces...", note:"Connecting to source and counting traces." },
      stalled:{ kind:"stalled", badge:"Taking longer than expected", pct:30, count:"120 / 400 traces", note:"No update for 3 min. You can leave this page. Progress is saved.", noteCls:"warn" },
      failed:{ kind:"failed", badge:"Failed", pct:30, count:"Stopped at trace 120 / 400", note:"Source API returned 503. Retry ingestion to continue.", noteCls:"err", actions:["Retry","View details"] },
      completed:{ kind:"done", badge:"Completed", pct:100, count:"400 / 400 traces in 2 min 41 s", actions:["View traces"] }
    }},
  scorecard: { label:"Scorecard building", title:"Building scorecard", sub:"Support Triage Agent", steps:["Analyze traces","Generate criteria","Validate"], total:20, unit:"criteria",
    states:{
      running:{ kind:"running", badge:"Running", pct:65, now:1, count:"Step 2 of 3: Generating criteria (13 / 20)" },
      indeterminate:{ kind:"running", badge:"Running", indet:true, now:0, count:"Step 1 of 3: Analyzing agent traces", note:"Working out how many criteria are needed." },
      stalled:{ kind:"stalled", badge:"Taking longer than expected", pct:65, now:1, count:"Step 2 of 3: Generating criteria (13 / 20)", note:"No update for 3 min. This can happen with large agents. Progress is saved.", noteCls:"warn" },
      failed:{ kind:"failed", badge:"Failed", pct:65, now:1, count:"Stopped at criterion 13 / 20", note:"Model call timed out. Rebuild the scorecard to continue.", noteCls:"err", actions:["Rebuild","View details"] },
      completed:{ kind:"done", badge:"Completed", pct:100, now:3, count:"20 criteria built in 1 min 58 s", actions:["View scorecard"] }
    }},
  scoring: { label:"Scoring run", title:"Scoring run #14", sub:"Started 4 min ago", steps:null, total:200, unit:"test cases",
    states:{
      running:{ kind:"running", badge:"Running", pct:87, count:"174 / 200 test cases scored", actions:["Cancel run"] },
      indeterminate:{ kind:"running", badge:"Running", indet:true, count:"Preparing test cases...", note:"Loading scorecard and test cases.", actions:["Cancel run"] },
      stalled:{ kind:"stalled", badge:"Taking longer than expected", pct:87, count:"174 / 200 test cases scored", note:"No update for 3 min. The judge model may be slow.", noteCls:"warn", actions:["Cancel run"] },
      failed:{ kind:"failed", badge:"Failed", pct:72, count:"Stopped at test case 144 / 200", note:"Judge model hit a rate limit (429). Wait a minute and retry the run.", noteCls:"err", actions:["Retry run","View details"] },
      completed:{ kind:"done", badge:"Completed", pct:100, count:"200 / 200 test cases scored in 5 min 12 s", actions:["View results"] },
      cancelled:{ kind:"stalled", badge:"Cancelled", pct:55, count:"Cancelled at 110 / 200", note:"Partial results were not saved.", actions:["Start new run"] }
    }}
};
let cur="ingestion", st="running", timer=null;

function stop(){ if(timer){ clearInterval(timer); timer=null; document.getElementById("play").innerHTML="&#9654; Play demo"; } }

function card(s, d, pctOverride, countOverride) {
  const pct = pctOverride ?? d.pct ?? 0;
  const fillCls = [d.kind, d.indet ? "indet" : ""].join(" ");
  const steps = s.steps ? `<div class="stepper">${s.steps.map((t,i)=>{
      const done = d.now > i, now = d.now === i;
      let cls = done ? "done" : now ? (d.kind==="failed"?"failed":d.kind==="stalled"?"stalled":"now") : "";
      return `<div class="st ${cls}"><div class="dot">${done?"&#10003;":i+1}</div>${t}</div>`; }).join("")}</div>` : "";
  const actions = d.actions ? `<div class="actions">${d.actions.map((a,i)=>
      `<button class="btn ${i===0&&!/Cancel/.test(a)?"primary":""} ${/Cancel/.test(a)?"danger":""}">${a}</button>`).join("")}</div>` : "";
  return `<div class="card">
    <div class="head">
      <div class="ico ${d.kind}">${ICON[d.kind]}</div>
      <div class="grow"><div class="ttl">${s.title}</div><div class="sub">${s.sub}</div></div>
      <span class="badge ${d.kind}">${d.badge}</span>
    </div>
    <div class="track"><div class="fill ${fillCls}" style="width:${pct}%"></div></div>
    <div class="stat"><span class="count">${countOverride ?? d.count}</span><span class="pct">${d.indet?"":Math.round(pct)+"%"}</span></div>
    ${steps}
    ${d.note ? `<div class="note ${d.noteCls||""}">${d.note}</div>` : ""}
    ${actions}
  </div>`;
}

function render() {
  document.getElementById("tabs").innerHTML = Object.entries(stages).map(([k,v]) =>
    `<button class="${k===cur?"on":""}" onclick="stop();cur='${k}';st='running';render()">${v.label}</button>`).join("");
  document.getElementById("states").innerHTML = Object.keys(stages[cur].states).map(k =>
    `<button class="chip ${k===st?"on":""}" onclick="stop();st='${k}';render()">${k}</button>`).join("");
  const s = stages[cur];
  document.getElementById("out").innerHTML = card(s, s.states[st]);
}

function playDemo() {
  if (timer) { stop(); render(); return; }
  const s = stages[cur], base = s.states.running;
  let p = 0;
  document.getElementById("play").innerHTML = "&#9632; Stop";
  timer = setInterval(() => {
    p += 2.5;
    if (p >= 100) {
      stop();
      st = "completed"; render(); return;
    }
    const n = Math.round(s.total * p / 100);
    const now = s.steps ? Math.min(2, Math.floor(p / 34)) : undefined;
    const count = s.steps ? `Step ${now+1} of 3: ${s.steps[now]}` : `${n} / ${s.total} ${s.unit}${cur==="scoring"?" scored":""}`;
    const d = { ...base, now, count };
    document.getElementById("out").innerHTML = card(s, d, p, count);
  }, 250);
}
render();
</script>
</body>
</html>
